name: Live scan (crypto, provisional)

# Runs the same strategies on today's unfinished candle. Results go to live.json only:
# provisional signals ("fires if it holds until the close"), never added to the alert feed,
# the track record or the notifications. The after-close scan confirms or drops them.
on:
  schedule:
    # every 4 hours (03:25, 07:25 ... 23:25 UTC), every day: today's daily candle so far.
    # The 00:20 daily scan handles the finished candle
    - cron: "25 3-23/4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: live-crypto
  cancel-in-progress: false

jobs:
  live:
    if: github.event_name != 'schedule' || vars.EXTERNAL_SCHEDULER != 'on'   # the scheduler Worker starts it on time instead (worker/README.md)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan today's open candle
        run: python engine/scan.py --market crypto --live
      - name: Publish
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "signal-desk-bot@users.noreply.github.com"
          git add -A docs/data/crypto/live.json docs/data/crypto/charts/live 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Live crypto $(date -u +%FT%H:%M)"
          git pull --rebase
          git push
