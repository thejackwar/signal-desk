name: Strategy screen

# The 87 new price-only stock strategies (research/quant/screen.py): screened on 2021-now,
# the best 15 confirmed on 2018-2020; then the improvement tests (screen.py --set improve) and the
# Research page data (docs/data/research.json). Writes to this branch only; the live site is untouched.
on:
  workflow_dispatch: {}
  push:
    branches: [strategy-screen]
    paths: ["research/quant/screen*.py", "research/quant/data/screen_descriptions.json", ".github/workflows/strategy-screen.yml"]

permissions:
  contents: write

concurrency:
  group: screen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt scipy pyarrow

      - name: Price cache (shared with the research engine)
        uses: actions/cache@v4
        with:
          path: research/quant/cache
          key: prices-${{ github.run_id }}
          restore-keys: prices-

      - name: Run the screen
        run: python -u research/quant/screen.py

      - name: Improvement tests (residual momentum, high-volume premium)
        run: python -u research/quant/screen.py --set improve

      - name: Research page data
        run: python research/quant/screen_site.py

      - name: Publish results to this branch
        if: always()
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "signal-desk-bot@users.noreply.github.com"
          git add research/quant/results/screen research/quant/results/improve docs/data/research.json || true
          git diff --cached --quiet || git commit -m "Strategy screen $(date -u +%F)"
          git pull --rebase
          git push
