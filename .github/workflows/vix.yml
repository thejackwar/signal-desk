name: VIX Seasonality

# Rebuilds docs/data/vix.json by hand (Actions tab -> Run workflow). The daily scan also refreshes it.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  vix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python engine/vix_season.py
      - name: Publish
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "signal-desk-bot@users.noreply.github.com"
          git add docs/data/vix.json
          git diff --cached --quiet || git commit -m "VIX seasonality $(date -u +%F)"
          ok=0; for i in 1 2 3 4; do git pull --rebase && git push && { ok=1; break; }; sleep 15; done; [ $ok = 1 ]
