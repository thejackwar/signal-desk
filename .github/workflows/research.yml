name: Research engine

# The honest backtest (research/quant/): point-in-time universe, costs, out-of-sample and luck
# tests. Writes research/quant/results/, and the stock line-up + evidence grades in docs/data/lineup.json.
on:
  workflow_dispatch: {}
  push:
    branches: [research-engine]
    paths: ["research/quant/**.py", ".github/workflows/research.yml"]
  schedule:
    - cron: "30 7 1 * *"     # first day of each month

permissions:
  contents: write

concurrency:
  group: research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt scipy pyarrow

      - name: Price cache
        uses: actions/cache@v4
        with:
          path: research/quant/cache
          key: prices-${{ github.run_id }}
          restore-keys: prices-

      - name: Run every stock strategy
        run: python -u research/quant/run.py

      - name: Update the site's stock line-up and evidence grades
        run: python research/quant/grades.py

      - name: Publish results
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "signal-desk-bot@users.noreply.github.com"
          git add research/quant/results docs/data/lineup.json
          git diff --cached --quiet || git commit -m "Research report $(date -u +%F)"
          git pull --rebase
          git push
