name: BTC liquidation heatmap

on:
  schedule:
    - cron: "40 */4 * * *"   # every 4 hours
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  heatmap:
    if: github.event_name != 'schedule' || vars.EXTERNAL_SCHEDULER != 'on'   # the scheduler Worker starts it on time instead (worker/README.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Estimate the BTC/USDT liquidation heatmap
        run: python engine/liquidations.py
      - name: Crypto market overview (fear & greed, funding, ETF flows, correlations)
        run: python engine/crypto_market.py || echo "market overview skipped"
      - name: Publish
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "signal-desk-bot@users.noreply.github.com"
          git add docs/data/crypto/liquidations.json docs/data/crypto/market.json 2>/dev/null || git add docs/data/crypto/liquidations.json
          git diff --cached --quiet || git commit -m "Liquidation heatmap $(date -u +%FT%H:%M)"
          git pull --rebase
          git push
