name: Fibonacci Burst (BTC)

# engine/fib_burst.py - Bitcoin: find a sharp burst (X% in N minutes on a volume spike), draw Fibonacci levels on
# it, trade the pullback. Binance 1-minute BTCUSDT from 2021 (public data, no key). Results: docs/data/fib/BURST.md.
# Runs by hand (workflow_dispatch) and when the engine changes.
on:
  push:
    branches: [main]
    paths: ["engine/fib_burst.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fib-burst
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy
      - name: Backtest
        run: python -u engine/fib_burst.py
      - name: Publish
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "signal-desk-bot@users.noreply.github.com"
          # A queued run checks out the commit that started it, so newer results may have landed on main meanwhile:
          # put this run's files on top of the latest main instead of rebasing onto it (this run's results win).
          F="docs/data/fib/burst.json docs/data/fib/BURST.md docs/data/fib/trades_btc.json"
          mkdir -p /tmp/out && cp $F /tmp/out/
          for i in 1 2 3; do
            git fetch origin main && git reset --hard origin/main
            cp /tmp/out/burst.json /tmp/out/BURST.md /tmp/out/trades_btc.json docs/data/fib/
            git add $F
            git diff --cached --quiet && exit 0
            git commit -m "Fibonacci Burst (BTC) backtest $(date -u +%F\ %H:%M)"
            git push origin HEAD:main && break
            sleep 5
          done
