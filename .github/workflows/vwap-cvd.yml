name: VWAP + CVD setups

# engine/vwap_cvd.py - backtest of the VWAP reclaim / rejection, CVD divergence and opening-drive setups
# (S&P 100, 1-minute bars from 2021; CVD from SIP trades on a 10-stock pilot), before building live alerts.
# Runs by hand (workflow_dispatch) and when the engine changes.
on:
  push:
    branches: [main]
    paths: ["engine/vwap_cvd.py"]
  workflow_dispatch:
    inputs:
      mode:
        description: "vwap (VWAP setups only, from 2021) or both (adds the CVD pilot - slow on the free plan)"
        default: vwap
      rpm:
        description: "Alpaca requests per minute (190 free plan, up to ~9000 on Algo Trader Plus)"
        default: "190"

permissions:
  contents: write

concurrency:
  group: vwap-cvd
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backtest
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          MAX_SECONDS: "19500"
          MODE: ${{ github.event.inputs.mode || 'vwap' }}
          ALPACA_RPM: ${{ github.event.inputs.rpm || '190' }}
        run: python -u engine/vwap_cvd.py
      - name: Publish
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "signal-desk-bot@users.noreply.github.com"
          git add docs/data/vwapcvd
          git diff --cached --quiet && exit 0
          git commit -m "VWAP + CVD backtest $(date -u +%F\ %H:%M)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
