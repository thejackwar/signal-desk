name: Probe data sources (temporary)
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install yfinance requests
      - run: |
          python - <<'PY' > probe.txt 2>&1
          import requests, re
          H={"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"}
          for k in ["btc","eth"]:
              t=requests.get(f"https://farside.co.uk/{k}/",headers=H,timeout=30).text
              i=t.find("<table")
              print("###",k, t.count("<table"), i)
              tabs=re.findall(r"<table.*?</table>", t, re.S)
              for tb in tabs:
                  print("TABLE len", len(tb))
                  rows=re.findall(r"<tr.*?</tr>", tb, re.S)
                  clean=lambda r: " | ".join(re.sub(r"<[^>]+>","",c).strip() for c in re.findall(r"<t[hd].*?</t[hd]>", r, re.S))
                  for r in rows[:4]+rows[-8:]: print(clean(r))
          PY
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git checkout -b probe-results; git add -f probe.txt; git commit -qm probe; git push -f origin probe-results
