name: Dark pool blocks

# Large off-exchange prints (exchange code "D" in the SIP feed) for the S&P 100, from Alpaca:
# engine/darkpool.py blocks. Every 30 minutes while the US market is open. Alpaca's free plan serves
# SIP trades that are at least 15 minutes old, so each run reads up to 16 minutes ago; the script exits
# straight away when there's nothing new. Big blocks go to the ntfy topic <NTFY_PREFIX>-darkpool.
on:
  schedule:
    - cron: "6,36 13-21 * * 1-5"   # 13:06-21:36 UTC covers 9:30-16:00 New York (+16 min) in summer and winter
  workflow_dispatch:
    inputs:
      test_day:
        description: "Test on a past session (YYYY-MM-DD): prints a summary, publishes nothing"
        required: false
      symbols:
        description: "Test only: comma-separated symbols (empty = all)"
        required: false

permissions:
  contents: write

concurrency:
  group: darkpool-blocks
  cancel-in-progress: false

jobs:
  blocks:
    if: github.event_name != 'schedule' || vars.EXTERNAL_SCHEDULER != 'on'   # the scheduler Worker starts it on time instead (worker/README.md)
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read the latest off-exchange prints
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          NTFY_PREFIX: ${{ vars.NTFY_PREFIX }}
        run: |
          if [ -n "${{ inputs.test_day }}" ]; then
            python engine/darkpool.py blocks --day "${{ inputs.test_day }}" --symbols "${{ inputs.symbols }}" --out /tmp/dp-test
            python -c "import json;b=json.load(open('/tmp/dp-test/blocks.json'));p=sorted(b['prints'],key=lambda x:-x['v']);print(len(p),'blocks');[print(x) for x in p[:15]];print({k:v for k,v in list(b['stocks'].items())[:8]})"
            exit 0
          fi
          python engine/darkpool.py blocks
      - name: The same for the S&P 500
        if: inputs.test_day == ''
        continue-on-error: true
        timeout-minutes: 12
        env:
          UNIVERSE: sp500
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          NTFY_PREFIX: ${{ vars.NTFY_PREFIX }}
        run: python engine/darkpool.py blocks
      - name: Publish
        if: inputs.test_day == ''
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "signal-desk-bot@users.noreply.github.com"
          git add -A docs/data/darkpool
          git add -A docs/data/sp500/darkpool 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Dark pool blocks $(date -u +%FT%H:%M)"
          ok=0; for i in 1 2 3 4; do git pull --rebase && git push && { ok=1; break; }; sleep 15; done; [ $ok = 1 ]
