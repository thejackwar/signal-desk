name: Snap-Back example charts data

# engine/snapback_examples.py - 1-minute candles for the recent Open Drive Snap-Back Leg 2 trades.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["engine/snapback_examples.py", ".github/workflows/snapback-examples.yml"]

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -u engine/snapback_examples.py
      - run: |
          git config user.name "signal-desk-bot"
          git config user.email "signal-desk-bot@users.noreply.github.com"
          git add docs/data/snapback/examples.json
          git diff --cached --quiet && exit 0
          git commit -m "Snap-Back example charts data"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
