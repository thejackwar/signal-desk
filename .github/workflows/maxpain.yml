name: Max pain

# Max pain for SPY, QQQ, IWM and the S&P 100: engine/maxpain.py (docs/maxpain.html).
# Open interest is published once a day, so this runs once a day: right after the gamma levels
# (before the US open). It also scores every expiry that's over: did the price really close near max pain?
on:
  workflow_run:
    workflows: ["Gamma levels"]
    types: [completed]
  schedule:
    - cron: "20 13 * * 1-5"   # backup, in case the gamma levels didn't run
  push:
    branches: [main]
    paths: ["engine/maxpain.py"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: maxpain
  cancel-in-progress: false

jobs:
  maxpain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compute max pain
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python engine/maxpain.py
      - name: Publish
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "signal-desk-bot@users.noreply.github.com"
          git add docs/data/maxpain
          git diff --cached --quiet && exit 0
          git commit -m "Max pain $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
