name: Market news tone (GDELT)

# Daily stock-market news tone for the News Contrarian strategy (engine/news_market.py).
# GDELT throttles GitHub's machines, so this runs on its own with a long time limit and never
# holds up anything else. A UTC day's news is only used from the next session's close.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  tone:
    if: github.event_name != 'schedule' || vars.EXTERNAL_SCHEDULER != 'on'   # the scheduler Worker starts it on time instead (worker/README.md)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy
      - run: python engine/news_market.py
      - name: Publish
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "signal-desk-bot@users.noreply.github.com"
          git add docs/data/news_market.json
          git diff --cached --quiet || git commit -m "Market news tone $(date -u +%F) [skip ci]"
          git pull --rebase
          git push
