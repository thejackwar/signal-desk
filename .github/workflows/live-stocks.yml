name: Live scan (stocks, provisional)

# Runs the same strategies on today's unfinished candle. Results go to live.json only:
# provisional signals ("fires if it holds until the close"), never added to the alert feed,
# the track record or the notifications. The after-close scan confirms or drops them.
on:
  schedule:
    # every 30 minutes, Monday to Friday, 13:05-20:35 UTC: covers the US session (9:30-16:00 New York)
    # in summer and winter time; the script exits straight away when the market is closed
    - cron: "5,35 13-20 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: live-stocks
  cancel-in-progress: false

jobs:
  live:
    if: github.event_name != 'schedule' || vars.EXTERNAL_SCHEDULER != 'on'   # the scheduler Worker starts it on time instead (worker/README.md)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan today's open candle
        run: python engine/scan.py --market stocks --live
      - name: Scan today's open candle, S&P 500
        continue-on-error: true
        env:
          UNIVERSE: sp500
        run: python engine/scan.py --market stocks --live
      - name: Publish
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "signal-desk-bot@users.noreply.github.com"
          git add -A docs/data/live.json docs/data/charts/live 2>/dev/null || true
          git add -A docs/data/sp500/live.json docs/data/sp500/charts/live 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Live stocks $(date -u +%FT%H:%M)"
          git pull --rebase
          git push
