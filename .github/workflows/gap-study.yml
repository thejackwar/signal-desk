name: Gap study

# Regular-session gap backtest, S&P 100 + S&P 500, 2021 -> today (research/gap-study/).
# Runs when the gap-study branch is pushed, or by hand; commits results back to that branch.
on:
  workflow_dispatch: {}
  push:
    branches: [gap-study]
    paths: ["research/gap-study/**.py", ".github/workflows/gap-study.yml"]

permissions:
  contents: write

concurrency:
  group: gap-study-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gaps:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt pyarrow

      - name: Price cache (shared with the research engine)
        uses: actions/cache@v4
        with:
          path: research/quant/cache
          key: prices-gap-${{ github.run_id }}
          restore-keys: prices-

      - name: Run the gap study
        run: python -u research/gap-study/gaps.py

      - name: Publish results
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "signal-desk-bot@users.noreply.github.com"
          git add research/gap-study/results
          git diff --cached --quiet || git commit -m "Gap study results $(date -u +%F)"
          git pull --rebase
          git push
