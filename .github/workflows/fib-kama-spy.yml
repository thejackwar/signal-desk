name: Fibonacci + Adaptive MA (SPY)

# engine/fib_kama_spy.py - SPY 1-minute bars from 2021: Fibonacci levels on the morning swing, direction from
# the adaptive moving average (KAMA 50), every entry level with exits one and two levels back.
# Results: docs/data/fib/SPY_KAMA.md. Runs by hand (workflow_dispatch) and when the engine changes.
on:
  push:
    branches: [main]
    paths: ["engine/fib_kama_spy.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fib-kama-spy
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backtest
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -u engine/fib_kama_spy.py
      - name: Publish
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "signal-desk-bot@users.noreply.github.com"
          git add docs/data/fib/spy_kama.json docs/data/fib/SPY_KAMA.md
          git diff --cached --quiet && exit 0
          git commit -m "SPY Fibonacci + Adaptive MA backtest $(date -u +%F\ %H:%M)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
