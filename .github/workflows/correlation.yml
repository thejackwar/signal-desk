name: Implied correlation

# Implied correlation surface for the S&P 500 (docs/correlation.html): engine/implied_corr.py.
# Runs near the US close, while option quotes are live: 19:45 UTC = 14:45 New York in winter, 15:45 in summer.
# Each run also adds a row to docs/data/corr/history.csv: free history of implied vols doesn't exist,
# so the page's implied history is what we collect.
on:
  schedule:
    - cron: "45 19 * * 1-5"
  push:
    branches: [main]
    paths: ["engine/implied_corr.py"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: correlation
  cancel-in-progress: false

jobs:
  correlation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compute the surface
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python engine/implied_corr.py
      - name: Publish
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "signal-desk-bot@users.noreply.github.com"
          git add docs/data/corr
          git diff --cached --quiet && exit 0
          git commit -m "Implied correlation $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
