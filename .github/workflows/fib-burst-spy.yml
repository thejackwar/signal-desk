name: Fibonacci Burst (SPY)

# engine/fib_burst_spy.py - the Bitcoin burst setup (engine/fib_burst.py) run on SPY 1-minute bars from 2021
# (regular session, nothing held overnight). Runs whenever either engine changes, so every change to the Bitcoin
# setup is tested on SPY too, and by hand. Results: docs/data/fib/BURST_spy.md.
on:
  push:
    branches: [main]
    paths: ["engine/fib_burst.py", "engine/fib_burst_spy.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fib-burst-spy
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy
      - name: Backtest
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -u engine/fib_burst_spy.py
      - name: Publish
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "signal-desk-bot@users.noreply.github.com"
          git add docs/data/fib/burst_spy.json docs/data/fib/BURST_spy.md docs/data/fib/trades_burst_spy.json
          git diff --cached --quiet && exit 0
          git commit -m "Fibonacci Burst (SPY) backtest $(date -u +%F\ %H:%M)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
