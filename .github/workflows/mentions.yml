name: News mentions

on:
  schedule:
    - cron: "20 5 * * *"    # daily, 06:20 Milan time (winter)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  mentions:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install numpy
      - name: Count news mentions per stock and coin (GDELT)
        run: python engine/mentions.py
      - name: Publish
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "signal-desk-bot@users.noreply.github.com"
          git add docs/data/mentions.json docs/data/crypto/mentions.json
          git diff --cached --quiet || git commit -m "News mentions $(date -u +%F)"
          git pull --rebase
          git push
