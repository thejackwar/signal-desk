name: News mentions

on:
  schedule:
    - cron: "20 */6 * * *"  # every 6 hours; the day's last run is kept in the history
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: mentions
  cancel-in-progress: true

jobs:
  mentions:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install numpy
      - name: Count news mentions per stock, coin and commodity (Google News)
        run: python engine/mentions.py
      - name: Publish
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "signal-desk-bot@users.noreply.github.com"
          git add docs/data    # a market with nothing new yet may have no file, so add the folder
          git diff --cached --quiet || git commit -m "News mentions $(date -u +%F)"
          git pull --rebase
          git push
