name: Live chart patterns (stocks)

# engine/live_patterns.py: every chart pattern forming or confirming on S&P 100 and S&P 500 stocks, on 15-minute,
# 1-hour, 4-hour and daily candles, for the Terminal's "Live patterns" section.
#  - live: every 30 minutes while the US market is open, plus once after the close for the daily candles
#    (the wide hours cover summer and winter time; the script exits when the market is closed).
#  - stats: the win rate of every pattern on each timeframe (S&P 100 backtest), every Saturday and when the engine
#    changes. The four timeframes run side by side, each with a time budget (a slow day keeps the stocks it finished),
#    then one job merges them into docs/data/live_patterns_stats.json. The live scan never waits for it.
# Started on time by the scheduler Worker (worker/scheduler-worker.js) when the repo variable EXTERNAL_SCHEDULER
# is "on"; the GitHub schedules below are only used when it's off.
on:
  schedule:
    - cron: "9,39 13-20 * * 1-5"     # live, during the session
    - cron: "39 21 * * 1-5"          # live, after the close in winter time (daily candles)
    - cron: "20 8 * * 6"             # stats, Saturday 08:20 UTC
  push:
    branches: [main]
    paths: ["engine/live_patterns.py", ".github/workflows/live-patterns.yml"]
  workflow_dispatch:
    inputs:
      job:
        description: "What to run"
        type: choice
        options: [live, stats, both]
        default: live
      force:
        description: "Scan even when the US market is closed"
        type: boolean
        default: false

permissions:
  contents: write

env:
  ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
  ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}

jobs:
  live:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule != '20 8 * * 6' && vars.EXTERNAL_SCHEDULER != 'on')
      || github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch' && inputs.job != 'stats')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: live-patterns-live
      cancel-in-progress: false
    env:
      FORCE: ${{ inputs.force && '--force' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore the candles from earlier runs (only the last days are downloaded)
        uses: actions/cache@v4
        with:
          path: .cache/live_patterns
          key: live-patterns-${{ github.run_id }}
          restore-keys: live-patterns-
      - name: Live scan, S&P 100
        run: python engine/live_patterns.py $FORCE
      - name: Publish the S&P 100
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "signal-desk-bot@users.noreply.github.com"
          for f in docs/data/live_patterns.json docs/data/sp500/live_patterns.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet && exit 0
          git commit -m "Live patterns $(date -u +%F\ %H:%M)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; git rebase --abort 2>/dev/null; sleep 5; done
      - name: Live scan, S&P 500
        continue-on-error: true     # the first run downloads 500 stocks; later runs only the last days (cache)
        timeout-minutes: 20
        env:
          UNIVERSE: sp500
        run: python engine/live_patterns.py $FORCE
      - name: Publish the S&P 500
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "signal-desk-bot@users.noreply.github.com"
          for f in docs/data/live_patterns.json docs/data/sp500/live_patterns.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet && exit 0
          git commit -m "Live patterns $(date -u +%F\ %H:%M)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; git rebase --abort 2>/dev/null; sleep 5; done

  stats:
    if: >-
      (github.event.schedule == '20 8 * * 6' && vars.EXTERNAL_SCHEDULER != 'on')
      || github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch' && inputs.job != 'live')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        tf: ["15m", "1H", "4H", "D"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Backtest ${{ matrix.tf }}
        run: python engine/live_patterns.py --stats ${{ matrix.tf }} --budget 110
      - uses: actions/upload-artifact@v4
        with:
          name: live-patterns-stats-${{ matrix.tf }}
          path: .cache/live_patterns_stats/${{ matrix.tf }}.json
          include-hidden-files: true
          retention-days: 3

  merge:
    needs: stats
    if: always() && needs.stats.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: live-patterns-merge
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: live-patterns-stats-*
          path: .cache/live_patterns_stats
          merge-multiple: true
      - name: Merge the four timeframes
        run: python engine/live_patterns.py --merge-stats
      - name: Publish
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "signal-desk-bot@users.noreply.github.com"
          git add docs/data/live_patterns_stats.json
          git diff --cached --quiet && exit 0
          git commit -m "Live patterns win rates $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; git rebase --abort 2>/dev/null; sleep 5; done
