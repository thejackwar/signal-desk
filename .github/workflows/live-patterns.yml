name: Live chart patterns (stocks)

# engine/live_patterns.py: every chart pattern forming or confirming on S&P 100 and S&P 500 stocks, on 15-minute,
# 1-hour, 4-hour and daily candles, for the Terminal's "Live patterns" section.
#  - live: every 30 minutes while the US market is open, plus once after the close for the daily candles
#    (the wide hours cover summer and winter time; the script exits when the market is closed).
#  - stats: the win rate of every pattern on each timeframe (S&P 100 backtest), every Saturday and when the engine changes.
# Runs on GitHub's own timer (it isn't in the scheduler Worker's list).
on:
  schedule:
    - cron: "9,39 13-20 * * 1-5"     # live, during the session
    - cron: "39 21 * * 1-5"          # live, after the close in winter time (daily candles)
    - cron: "20 8 * * 6"             # stats, Saturday 08:20 UTC
  push:
    branches: [main]
    paths: ["engine/live_patterns.py", ".github/workflows/live-patterns.yml"]
  workflow_dispatch:
    inputs:
      job:
        description: "What to run"
        type: choice
        options: [live, stats]
        default: live

permissions:
  contents: write

concurrency:
  group: live-patterns
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      STATS: ${{ github.event.schedule == '20 8 * * 6' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.job == 'stats') }}
      FORCE: ${{ github.event_name != 'schedule' && '--force' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore the candles from earlier runs (only the last days are downloaded)
        uses: actions/cache@v4
        with:
          path: .cache/live_patterns
          key: live-patterns-${{ github.run_id }}
          restore-keys: live-patterns-
      - name: Win rates (S&P 100 backtest)
        if: env.STATS == 'true'
        timeout-minutes: 90
        run: python engine/live_patterns.py --stats
      - name: Live scan, S&P 100
        run: python engine/live_patterns.py $FORCE
      - name: Live scan, S&P 500
        continue-on-error: true
        env:
          UNIVERSE: sp500
        run: python engine/live_patterns.py $FORCE
      - name: Publish
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "signal-desk-bot@users.noreply.github.com"
          for f in docs/data/live_patterns.json docs/data/live_patterns_stats.json docs/data/sp500/live_patterns.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet && exit 0
          git commit -m "Live patterns $(date -u +%F\ %H:%M)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; git rebase --abort 2>/dev/null; sleep 5; done
