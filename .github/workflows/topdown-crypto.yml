name: Crypto Top-Down alerts (24/7)

on:
  schedule:
    # every 30 minutes, every day: crypto never closes. This one always runs on GitHub's own
    # schedule (it can start a few minutes late, which is fine for 30-minute checks).
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: topdown-crypto
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check the trendlines on every coin
        env:
          NTFY_PREFIX: ${{ vars.NTFY_PREFIX }}
        run: python engine/topdown.py --market crypto
      - name: Publish new alerts
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "signal-desk-bot@users.noreply.github.com"
          git add docs/data/crypto/topdown.json
          git diff --cached --quiet && exit 0
          git commit -m "Crypto Top-Down alerts $(date -u +%F\ %H:%M)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
