name: Daily scan

on:
  schedule:
    # 22:15 UTC, Monday to Friday: after the US close in both summer and winter time
    - cron: "15 22 * * 1-5"
  workflow_dispatch: {}   # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scan the S&P 100
        env:
          NTFY_PREFIX: ${{ vars.NTFY_PREFIX }}
        run: python engine/scan.py

      - name: Publish new alerts
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "signal-desk-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Alerts for $(date -u +%F)"
          git pull --rebase
          git push
