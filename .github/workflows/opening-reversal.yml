name: Opening Reversal

# engine/opening_reversal.py - backtest of "let the first 20 minutes set a trend, then trade the reversal" on the
# S&P 100 (5-minute bars, from 2021), plus the trade-the-trend mirror.
# Runs by hand (workflow_dispatch) and when the engine changes.
on:
  push:
    branches: [main]
    paths: ["engine/opening_reversal.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opening-reversal
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backtest
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -u engine/opening_reversal.py
      - name: Publish
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "signal-desk-bot@users.noreply.github.com"
          git add docs/data/reversal
          git diff --cached --quiet && exit 0
          git commit -m "Opening Reversal backtest $(date -u +%F\ %H:%M)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
