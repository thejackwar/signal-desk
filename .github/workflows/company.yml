name: Company data

# Financials, analyst ratings and estimates, holders, insiders, short interest, dividends and
# volume stats for every S&P 100 stock (engine/company.py -> docs/data/company.json + docs/data/company/).
# Also runs when the script changes.
on:
  schedule:
    - cron: "50 22 * * 1-5"     # after the US close
  push:
    branches: [main]
    paths: [engine/company.py, .github/workflows/company.yml]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: company-data
  cancel-in-progress: false

jobs:
  company:
    if: github.event_name != 'schedule' || vars.EXTERNAL_SCHEDULER != 'on'   # the scheduler Worker starts it on time instead (worker/README.md)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt "yfinance>=1.0"
      - run: python engine/company.py
      - name: Publish
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "signal-desk-bot@users.noreply.github.com"
          git add docs/data/company.json docs/data/company
          git diff --cached --quiet || git commit -m "Company data $(date -u +%F)"
          ok=0; for i in 1 2 3 4; do git pull --rebase && git push && { ok=1; break; }; sleep 15; done; [ $ok = 1 ]
