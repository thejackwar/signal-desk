name: Top-Down alerts

on:
  schedule:
    # every 30 minutes, Monday to Friday, 13:00-21:59 UTC. That covers the US session in both
    # summer and winter time; the script itself exits straight away when the market is closed.
    - cron: "2,32 13-21 * * 1-5"
  workflow_dispatch: {}   # run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: topdown          # never two runs at once
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check the trendlines
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          NTFY_PREFIX: ${{ vars.NTFY_PREFIX }}
        run: python engine/topdown.py

      - name: Publish new alerts
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "signal-desk-bot@users.noreply.github.com"
          git add docs/data/topdown
          git diff --cached --quiet && exit 0
          git commit -m "Top-Down alerts $(date -u +%F\ %H:%M)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
