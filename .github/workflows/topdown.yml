name: Top-Down alerts

on:
  schedule:
    # every 30 minutes, Monday to Friday, 13:00-21:59 UTC. That covers the US session in both
    # summer and winter time; the script itself exits straight away when the market is closed.
    - cron: "2,32 13-21 * * 1-5"
  workflow_dispatch:      # run it by hand from the Actions tab
    inputs:
      force:
        description: "Run even when the US market is closed (warms the bar cache)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: topdown          # never two runs at once
  cancel-in-progress: false

jobs:
  scan:
    if: github.event_name != 'schedule' || vars.EXTERNAL_SCHEDULER != 'on'   # the scheduler Worker starts it on time instead (worker/README.md)
    runs-on: ubuntu-latest
    timeout-minutes: 90     # the first run downloads months of bars; later runs only fetch what's new
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
      - name: Restore the bars from earlier runs
        uses: actions/cache@v4
        with:
          path: |
            .cache/topdown
            .cache/topdown500
          key: topdown-bars-${{ github.run_id }}
          restore-keys: topdown-bars-

      - name: Check the trendlines
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          NTFY_PREFIX: ${{ vars.NTFY_PREFIX }}
        run: python -u engine/topdown.py ${{ inputs.force && '--force' || '' }}

      - name: The same for the S&P 500
        continue-on-error: true   # never hold back the S&P 100 alerts
        timeout-minutes: 40
        env:
          UNIVERSE: sp500
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          NTFY_PREFIX: ${{ vars.NTFY_PREFIX }}
        run: python -u engine/topdown.py ${{ inputs.force && '--force' || '' }}

      - name: Publish new alerts
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "signal-desk-bot@users.noreply.github.com"
          git add docs/data/topdown
          git add docs/data/sp500/topdown 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Top-Down alerts $(date -u +%F\ %H:%M)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
