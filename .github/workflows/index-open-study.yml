name: Index Open Study

# engine/index_open_study.py - does SPY / QQQ's pre-market direction tell the first 30-60 minutes?
# Research only. Runs by hand (workflow_dispatch) and when the study changes.
on:
  push:
    branches: [main]
    paths: ["engine/index_open_study.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: index-open-study
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Study
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -u engine/index_open_study.py
      - name: Publish
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "signal-desk-bot@users.noreply.github.com"
          git add docs/data/index_open research/index-open
          git diff --cached --quiet && exit 0
          git commit -m "Index Open Study $(date -u +%F\ %H:%M)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
