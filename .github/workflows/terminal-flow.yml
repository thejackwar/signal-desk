name: Terminal flow

# Buying/selling volume, options activity, the market mood gauge and the Focus list for the Terminal
# (engine/terminal_flow.py -> docs/data/terminal/flow.json). Runs right after every live stock scan
# (every 30 minutes while the US market is open) and after the evening scan, so it always scores the newest
# alerts. New Focus alerts go to the ntfy channel <NTFY_PREFIX>-focus.
on:
  workflow_run:
    workflows: ["Live scan (stocks, provisional)", "Daily scan"]
    types: [completed]
  push:
    branches: [main]
    paths: [engine/terminal_flow.py, .github/workflows/terminal-flow.yml]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: terminal-flow
  cancel-in-progress: false

jobs:
  flow:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pull the newest alerts
        run: git pull --rebase || true
      - name: Build the Terminal data
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          NTFY_PREFIX: ${{ vars.NTFY_PREFIX }}
        run: python engine/terminal_flow.py
      - name: Publish
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "signal-desk-bot@users.noreply.github.com"
          git add docs/data/terminal
          git diff --cached --quiet && exit 0
          git commit -m "Terminal flow $(date -u +%FT%H:%M)"
          for i in 1 2 3 4; do git pull --rebase && git push && break; sleep 7; done
