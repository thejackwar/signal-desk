name: Terminal flow

# Buying/selling volume, options activity, the market mood gauge and the Focus list for the Terminal
# (engine/terminal_flow.py -> docs/data/terminal/flow.json). Runs right after every live stock scan
# (every 30 minutes while the US market is open) and after the evening scan, so it always scores the newest
# alerts. After a live scan it also refreshes twice more, 10 minutes apart (prices, volume, mood, Focus;
# options only on the full run), so the Terminal updates about every 10 minutes during US hours. New Focus alerts go to the ntfy channel <NTFY_PREFIX>-focus.
on:
  workflow_run:
    workflows: ["Live scan (stocks, provisional)", "Daily scan"]
    types: [completed]
  push:
    branches: [main]
    paths: [engine/terminal_flow.py, .github/workflows/terminal-flow.yml]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: terminal-flow
  cancel-in-progress: false

jobs:
  flow:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build and publish (full run, then quick refreshes every 10 minutes in US hours)
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          NTFY_PREFIX: ${{ vars.NTFY_PREFIX }}
          LOOP: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Live scan (stocks, provisional)' && '3' || '1' }}
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "signal-desk-bot@users.noreply.github.com"
          for n in $(seq 1 "$LOOP"); do
            git pull --rebase -q || true                     # newest alerts, live scan and dark pool files
            if [ "$n" = 1 ]; then python engine/terminal_flow.py; else python engine/terminal_flow.py --fast; fi
            # the S&P 500 version (docs/data/sp500/terminal/); a failure never stops the S&P 100 one
            if [ "$n" = 1 ]; then UNIVERSE=sp500 python engine/terminal_flow.py || true; else UNIVERSE=sp500 python engine/terminal_flow.py --fast || true; fi
            git add docs/data/terminal
            git add docs/data/sp500/terminal 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -q -m "Terminal flow $(date -u +%FT%H:%M)"
              for i in 1 2 3 4; do git pull --rebase -q && git push -q && break; sleep 7; done
            fi
            if [ "$n" != "$LOOP" ]; then
              # stop early once the US session is over (21:05 UTC covers summer and winter time)
              [ "$(date -u +%H%M)" -ge 2105 ] && break
              sleep 540
            fi
          done
