# Deploys worker/trendlines-worker.js to Cloudflare (the "trendlines" data Worker) whenever it changes,
# so nobody has to paste it into the dashboard. Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN   a token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the account ID shown on the Cloudflare dashboard (Workers & Pages, right side)
# Keeps what was set up by hand: it reads the Worker's bindings, timers and compatibility date from
# Cloudflare and deploys with exactly those (the Alpaca secrets survive deploys on their own).
name: Deploy data Worker

on:
  push:
    branches: [main]
    paths: [worker/trendlines-worker.js, .github/workflows/deploy-worker.yml]
  workflow_dispatch:

concurrency: deploy-worker

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check the secrets are set
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set yet: nothing deployed (see worker/README.md)."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
        if: env.SKIP != '1'
      - uses: actions/setup-node@v4
        if: env.SKIP != '1'
        with: { node-version: 20 }
      - name: Read the Worker's current settings
        if: env.SKIP != '1'
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/trendlines"
          H="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS -H "$H" "$API/settings" > settings.json
          curl -fsS -H "$H" "$API/schedules" > schedules.json
          echo "Bindings now:"; jq -r '.result.bindings[] | "  \(.type) \(.name)"' settings.json
          echo "Timers now:"; jq -r '.result.schedules[]?.cron | "  \(.)"' schedules.json
          DATE=$(jq -r '.result.compatibility_date // "2024-09-23"' settings.json)
          {
            echo 'name = "trendlines"'
            echo 'main = "worker/trendlines-worker.js"'
            echo "compatibility_date = \"$DATE\""
            echo 'workers_dev = true'
            # storage bindings exactly as they are on Cloudflare (PX for price alerts, if set up)
            jq -r '.result.bindings[] | select(.type == "kv_namespace") | "\n[[kv_namespaces]]\nbinding = \"\(.name)\"\nid = \"\(.namespace_id)\""' settings.json
            CRONS=$(jq -c '[.result.schedules[]?.cron]' schedules.json)
            printf '\n[triggers]\ncrons = %s\n' "$CRONS"
          } > wrangler.toml
          echo "--- wrangler.toml"; cat wrangler.toml
          # secrets (the Alpaca keys) are kept by Cloudflare; plain variables are kept by --keep-vars
          OTHER=$(jq -r '[.result.bindings[] | select(.type != "kv_namespace" and .type != "secret_text" and .type != "plain_text") | .type] | join(",")' settings.json)
          if [ -n "$OTHER" ]; then echo "::error::The Worker has bindings this deploy doesn't copy ($OTHER): stopping so nothing is lost."; exit 1; fi
      - name: Deploy
        if: env.SKIP != '1'
        run: npx --yes wrangler@3 deploy --keep-vars
