name: News

on:
  schedule:
    - cron: "10 * * * *"    # every hour
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  news:
    if: github.event_name != 'schedule' || vars.EXTERNAL_SCHEDULER != 'on'   # the scheduler Worker starts it on time instead (worker/README.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install feedparser
      - name: Collect stock, crypto and commodity headlines
        run: python engine/news.py
      # News mood: per-stock headlines from Alpaca, scored by FinBERT (engine/sentiment.py).
      # Kept separate from the headlines: if anything here fails, the headlines still publish.
      - name: Cache the FinBERT model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: finbert-v1
      - name: Install FinBERT (CPU only)
        continue-on-error: true
        id: finbert
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers>=4.40"
      - name: News mood for each stock
        if: steps.finbert.outcome == 'success'
        continue-on-error: true
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python engine/sentiment.py
      - name: Publish
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "signal-desk-bot@users.noreply.github.com"
          git add docs/data    # a market with nothing new yet may have no file, so add the folder
          git diff --cached --quiet || git commit -m "News $(date -u +%FT%H:%M)"
          git pull --rebase
          git push
