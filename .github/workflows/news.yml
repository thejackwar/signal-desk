name: News

on:
  schedule:
    - cron: "10 * * * *"    # every hour
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install feedparser
      - name: Collect stock and crypto headlines
        run: python engine/news.py
      - name: Publish
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "signal-desk-bot@users.noreply.github.com"
          git add docs/data/news.json docs/data/crypto/news.json
          git diff --cached --quiet || git commit -m "News $(date -u +%FT%H:%M)"
          git pull --rebase
          git push
