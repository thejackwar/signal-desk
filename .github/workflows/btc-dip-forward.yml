name: BTC dip study - forward test

# Paper-trades the BTC buy-the-dip variants from 31 Oct 2026 onward (research/btc-dip/forward_test.py).
# The script replays every candle since the start, so a late or skipped run never loses a trade.
on:
  schedule:
    - cron: "7 * * * *"      # every hour, a few minutes after the hourly candle closes
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: btc-dip-forward
  cancel-in-progress: false

jobs:
  forward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy
      - run: python research/btc-dip/forward_test.py
      - name: Publish
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "signal-desk-bot@users.noreply.github.com"
          git add research/btc-dip/forward
          git diff --cached --quiet || git commit -m "BTC dip forward test $(date -u +%FT%H:%M)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
