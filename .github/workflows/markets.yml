name: Terminal market boards

# World indices, currencies, yield curves, Fed odds, futures curves and COT for the Terminal
# (engine/markets_board.py -> docs/data/terminal/markets.json), then today's outlook box
# (engine/outlook.py -> docs/data/terminal/outlook.json). Also runs when the script changes.
on:
  schedule:
    - cron: "22 6-21 * * 1-5"   # every hour on weekdays, European morning to US close
    - cron: "22 9 * * 0,6"      # once on weekend days
  push:
    branches: [main]
    paths: [engine/markets_board.py, engine/outlook.py, .github/workflows/markets.yml]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: markets-board
  cancel-in-progress: false

jobs:
  markets:
    if: github.event_name != 'schedule' || vars.EXTERNAL_SCHEDULER != 'on'   # the scheduler Worker starts it on time instead (worker/README.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python engine/markets_board.py
      # today's outlook box (engine/outlook.py): reads the boards just built plus the site's other files
      - run: python engine/outlook.py || echo "outlook failed, keeping the old one"
      - name: Publish
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "signal-desk-bot@users.noreply.github.com"
          git add docs/data/terminal/markets.json docs/data/terminal/outlook.json docs/data/terminal/outlook_log.json 2>/dev/null || git add docs/data/terminal/markets.json
          git diff --cached --quiet || git commit -m "Market boards $(date -u +%FT%H:%M)"
          ok=0; for i in 1 2 3 4; do git pull --rebase && git push && { ok=1; break; }; sleep 15; done; [ $ok = 1 ]
