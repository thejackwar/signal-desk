name: Earnings research (one-off)

on:
  push:
    branches: [earnings-research]
  workflow_dispatch: {}

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt "yfinance>=1.0" lxml tabulate
      - run: python engine/earnings_research.py
      - uses: actions/upload-artifact@v4
        with:
          name: earnings-research
          path: research/
