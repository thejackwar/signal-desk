name: Earnings research (one-off)

on:
  push:
    branches: [earnings-research]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt "yfinance>=1.0" lxml tabulate
      - run: python engine/earnings_research.py
      - name: Commit results to this branch
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "signal-desk-bot@users.noreply.github.com"
          git add -f research/earnings_results.json research/earnings_report.md
          git commit -m "Earnings research results [skip ci]"
          git push
