name: Daily crypto scan

on:
  schedule:
    # crypto trades every day; the daily candle closes at 00:00 UTC
    - cron: "20 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    if: github.event_name != 'schedule' || vars.EXTERNAL_SCHEDULER != 'on'   # the scheduler Worker starts it on time instead (worker/README.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan the top cryptocurrencies
        env:
          NTFY_PREFIX: ${{ vars.NTFY_PREFIX }}
        run: python engine/scan.py --market crypto
      - name: Long euro price history (DCA calculator, seasonality)
        run: python engine/crypto_market.py --long || echo "long history skipped"
      - name: Publish new alerts
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "signal-desk-bot@users.noreply.github.com"
          git add docs/data/crypto
          git diff --cached --quiet || git commit -m "Crypto alerts for $(date -u +%F)"
          git pull --rebase
          git push
