<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Signal Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Signal Desk">
<meta name="theme-color" content="#08090b">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow column like a phone app, bottom tab bar, charts on true black like a trading terminal. Dark by design. */
:root {
  --bg: #08090b;
  --surface: #121418;
  --surface-2: #1a1d23;
  --line: #262a32;
  --fg: #e9ebee;
  --muted: #8b929d;
  --faint: #5b616b;
  --amber: #f2b33d;
  --blue: #74a7f5;
  --bull: #32c48d;
  --bear: #f05a63;
  --bull-bg: rgba(50,196,141,.13);
  --bear-bg: rgba(240,90,99,.13);
  --chart: #000000;
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --tabbar: 64px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font: 15px/1.5 var(--font-body);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; border-radius: 6px; }
a { color: var(--blue); }

.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px calc(var(--tabbar) + 28px + env(safe-area-inset-bottom, 0px));
}

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding-block: 12px 10px; display: flex; align-items: center; gap: 10px; min-height: 52px; }
.top h1 { font: 700 26px/1.1 var(--font-display); letter-spacing: -.01em; margin: 0; flex: 1; min-width: 0; text-wrap: balance; }
.back, .btn { text-decoration: none; }
.back { display: inline-flex; align-items: center; gap: 4px; color: var(--amber); font-weight: 500; padding: 6px 4px 6px 0; }
.stamp { font: 500 11px/1.3 var(--font-mono); color: var(--muted); text-align: right; letter-spacing: .02em; }

.demo { background: rgba(242,179,61,.1); border: 1px solid rgba(242,179,61,.35); color: var(--amber); border-radius: 10px; padding: 9px 12px; font-size: 13px; margin-bottom: 12px; }

/* chips */
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 8px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 600; }

/* alert feed */
.day { font: 600 11px/1 var(--font-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--faint); padding: 18px 0 8px; display: flex; justify-content: space-between; }
.alert { width: 100%; text-align: left; display: grid; grid-template-columns: 4px 1fr auto; gap: 0 12px; padding: 12px 0; border-top: 1px solid var(--line); align-items: start; }
.day + .alert { border-top: 0; }
.stripe { width: 4px; align-self: stretch; border-radius: 2px; }
.bullish .stripe { background: var(--bull); }
.bearish .stripe { background: var(--bear); }
.alert .main { min-width: 0; }
.tk { font: 600 16px/1.2 var(--font-mono); letter-spacing: .02em; }
.alert .strat { font-size: 12px; color: var(--amber); margin-left: 6px; font-family: var(--font-body); font-weight: 500; letter-spacing: 0; }
.alert .note { color: var(--muted); font-size: 13.5px; margin-top: 3px; }
.alert .px { text-align: right; font: 500 14px/1.2 var(--font-mono); font-variant-numeric: tabular-nums; }
.pill { display: inline-block; font: 600 10.5px/1 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; padding: 4px 6px; border-radius: 5px; margin-top: 6px; }
.bullish .pill, .pill.bullish { color: var(--bull); background: var(--bull-bg); }
.bearish .pill, .pill.bearish { color: var(--bear); background: var(--bear-bg); }

.empty { color: var(--muted); padding: 28px 4px; text-align: center; }
.empty strong { color: var(--fg); display: block; font: 700 18px/1.3 var(--font-display); margin-bottom: 6px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--amber); color: #1a1204; font-weight: 600; border-radius: 10px; padding: 11px 16px; }
.btn.ghost { background: var(--surface-2); color: var(--fg); }
.btn.on { background: var(--surface-2); color: var(--amber); }

/* strategies list */
.cat { font: 600 11px/1 var(--font-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--faint); padding: 18px 0 8px; }
.srow { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 14px; background: var(--surface); border-radius: 14px; margin-bottom: 8px; }
.srow .open { text-align: left; min-width: 0; }
.srow h3 { margin: 0; font: 700 17px/1.25 var(--font-display); }
.srow p { margin: 3px 0 0; color: var(--muted); font-size: 13.5px; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 8px; margin-top: 8px; font: 500 11px/1 var(--font-mono); color: var(--faint); letter-spacing: .03em; }
.meta b { color: var(--muted); font-weight: 500; }
.meta span { white-space: nowrap; }
.toggle { width: 50px; height: 30px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); position: relative; flex: none; transition: background .15s; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--muted); transition: transform .15s, background .15s; }
.toggle[aria-checked="true"] { background: rgba(242,179,61,.22); border-color: rgba(242,179,61,.5); }
.toggle[aria-checked="true"]::after { transform: translateX(20px); background: var(--amber); }

/* strategy detail */
.tag { color: var(--muted); font-size: 16px; margin: 0 0 14px; }
.lede { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.badge { font: 500 11px/1 var(--font-mono); letter-spacing: .04em; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
.prose p { margin: 0 0 12px; max-width: 65ch; }
h2 { font: 700 19px/1.3 var(--font-display); margin: 26px 0 10px; text-wrap: balance; }
.rules { display: grid; gap: 8px; }
.rule { border-radius: 12px; padding: 12px 14px; background: var(--surface); border-left: 3px solid; }
.rule.bullish { border-color: var(--bull); }
.rule.bearish { border-color: var(--bear); }
.rule .pill { margin: 0 0 6px; }
.rule p { margin: 0; }
ul.watch { margin: 0; padding-left: 18px; }
ul.watch li { margin-bottom: 8px; }
.settings { font: 400 12.5px/1.5 var(--font-mono); color: var(--muted); background: var(--surface); border-radius: 10px; padding: 10px 12px; }

/* charts */
.chartbox { background: var(--chart); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.readout { font: 400 11.5px/1.3 var(--font-mono); color: var(--muted); padding: 10px 12px 0; min-height: 25px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.readout b { color: var(--fg); font-weight: 500; }
.chart { display: block; width: 100%; touch-action: pan-y; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 0 12px 10px; font: 400 11px/1.3 var(--font-mono); color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 2px; vertical-align: middle; margin-right: 5px; }
.caption { margin: 10px 2px 0; font-size: 14px; }
.caption .sim { color: var(--faint); font-size: 12px; display: block; margin-top: 4px; }
.seg { display: inline-flex; background: var(--surface); border-radius: 10px; padding: 3px; margin-bottom: 10px; }
.seg button { padding: 6px 12px; border-radius: 8px; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--fg); font-weight: 600; }
.up { color: var(--bull); } .down { color: var(--bear); }

/* backtest */
.h3 { font: 700 16px/1.3 var(--font-display); margin: 22px 0 8px; }
.hint { color: var(--faint); font-size: 12.5px; margin: 8px 2px 0; }
.tablewrap { overflow-x: auto; background: var(--surface); border-radius: 14px; }
table.bt { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.bt th { font: 500 11px/1 var(--font-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--faint); text-align: left; padding: 12px 12px 8px; }
table.bt td { padding: 10px 12px; border-top: 1px solid var(--line); vertical-align: top; }
table.bt td:first-child { font: 500 13px var(--font-mono); color: var(--muted); white-space: nowrap; }
table.bt b { display: block; font: 600 17px/1.2 var(--font-mono); }
table.bt small { display: block; color: var(--faint); font-size: 11.5px; margin-top: 2px; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.tiles div { background: var(--surface); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.tiles span { display: block; font: 500 11px/1 var(--font-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--faint); }
.tiles b { display: block; font: 600 19px/1.3 var(--font-mono); margin-top: 6px; font-variant-numeric: tabular-nums; }
.tiles small { color: var(--muted); font-size: 12px; }
.bwgrid { display: grid; gap: 0 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.bwrow { display: grid; grid-template-columns: 54px auto 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.bwrow .d { color: var(--muted); font-size: 13px; }
.bwrow > span:last-child { font: 600 14px var(--font-mono); }

/* alert detail */
.big { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 2px 0 6px; }
.big .tk { font-size: 30px; }
.big .px { font: 500 18px var(--font-mono); color: var(--muted); }
.sub { color: var(--muted); margin: 0 0 14px; }
.card { background: var(--surface); border-radius: 14px; padding: 14px; margin-top: 14px; }
.card h3 { margin: 0 0 4px; font: 700 16px var(--font-display); }
.card p { margin: 0 0 10px; color: var(--muted); font-size: 14px; }

/* notifications */
.steps { margin: 0; padding-left: 20px; }
.steps li { margin-bottom: 10px; }
.topic { display: flex; justify-content: space-between; gap: 10px; align-items: center; background: var(--surface); border-radius: 10px; padding: 10px 12px; margin-bottom: 6px; }
.topic code { font: 400 13px var(--font-mono); overflow-wrap: anywhere; min-width: 0; }
.topic button { color: var(--amber); font-size: 13px; font-weight: 600; flex: none; }
.fine { color: var(--faint); font-size: 12.5px; margin-top: 26px; }

/* tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: rgba(8,9,11,.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.tabs nav { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); height: var(--tabbar); }
.tabs a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--faint); text-decoration: none; font-size: 11px; font-weight: 500; position: relative; }
.tabs a[aria-current="page"] { color: var(--amber); }
.tabs svg { width: 24px; height: 24px; }
.count { position: absolute; top: 8px; left: calc(50% + 6px); background: var(--bear); color: #fff; font: 600 10px/16px var(--font-mono); min-width: 16px; padding: 0 4px; border-radius: 8px; text-align: center; }

.loading { color: var(--muted); padding: 40px 0; text-align: center; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main class="wrap" id="app"><p class="loading">Loading…</p></main>

<div class="tabs">
  <nav aria-label="Sections">
    <a href="#alerts" data-tab="alerts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 1 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9Z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
      Alerts<span class="count" id="badge" hidden></span>
    </a>
    <a href="#strategies" data-tab="strategies">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M6 16V9"/><path d="M4.5 9h3"/><path d="M12 16V5"/><path d="M10.5 5h3"/><path d="M18 16v-5"/><path d="M16.5 11h3"/></svg>
      Strategies
    </a>
    <a href="#notify" data-tab="notify">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>
      Phone alerts
    </a>
  </nav>
</div>

<script>
(() => {
  const DEFAULT_FOLLOW = ["ma200", "bollinger", "donchian"];
  const STORE = "signaldesk.follow";
  const SEEN = "signaldesk.seen";
  const S = { strategies: [], byId: {}, feed: null, follow: new Set(), filter: "all", exSide: {}, btSide: {}, bt: null };
  const app = document.getElementById("app");
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const slug = id => id.replace(/_/g, "-");
  const unslug = s => s.replace(/-/g, "_");

  function load(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; } }
  function save(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch {} }

  // ---------------------------------------------------------------- dates
  const DAY = 864e5;
  const parse = d => new Date(d + "T12:00:00Z");
  const fmtDate = (d, opts) => parse(d).toLocaleDateString("en-GB", { timeZone: "UTC", ...opts });
  function dayLabel(d) {
    const asOf = S.feed?.as_of;
    if (d === asOf) return "Latest session";
    const diff = Math.round((parse(asOf) - parse(d)) / DAY);
    if (diff < 7) return fmtDate(d, { weekday: "long" });
    return fmtDate(d, { day: "numeric", month: "long" });
  }
  const money = v => v == null ? "–" : v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  // --------------------------------------------------------------- charts
  const C = { up: "#32c48d", down: "#f05a63", grid: "#1b1e24", axis: "#6b727c", accent: "#f2b33d", accent2: "#74a7f5", muted: "#9aa1ab", band: "#74a7f5", shape: "#f2b33d" };
  const STYLE = { accent: C.accent, accent2: C.accent2, muted: C.muted, band: C.band };

  function niceTicks(lo, hi, count) {
    const span = hi - lo, raw = span / count, mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw) || raw;
    const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(6));
    return out;
  }

  function linePath(vals, x, y) {
    let d = "", pen = false;
    vals.forEach((v, i) => { if (v == null) { pen = false; return; } d += (pen ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1); pen = true; });
    return d;
  }

  function drawChart(box, data, opts = {}) {
    const W = Math.max(280, box.clientWidth || 340);
    const n = data.c.length;
    const P = { l: 6, r: 50, t: 10 }, priceH = Math.round(Math.min(260, W * 0.62)), panelGap = 14;
    const panelH = data.panel ? 86 : 0, axisH = 22;
    const H = P.t + priceH + (panelH ? panelGap + panelH : 0) + axisH;
    const cw = (W - P.l - P.r) / n;
    const x = i => P.l + (i + 0.5) * cw;

    // price scale covers candles, overlays and drawings
    let lo = Infinity, hi = -Infinity;
    const take = v => { if (v != null) { lo = Math.min(lo, v); hi = Math.max(hi, v); } };
    data.l.forEach(take); data.h.forEach(take);
    data.overlays.forEach(o => o.values.forEach(take));
    data.shapes.forEach(s => s.points.forEach(p => take(p[1])));
    const padv = (hi - lo) * 0.06; lo -= padv; hi += padv;
    const y = v => P.t + (hi - v) / (hi - lo) * priceH;

    let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(opts.label || "Price chart")}">`;
    svg += `<rect x="0" y="0" width="${W}" height="${H}" fill="#000"/>`;
    for (const t of niceTicks(lo, hi, 4)) {
      svg += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" stroke="${C.grid}" stroke-width="1"/>`;
      svg += `<text x="${W - P.r + 6}" y="${(y(t) + 4).toFixed(1)}" fill="${C.axis}" font-size="10.5" font-family="IBM Plex Mono, monospace">${t < 1000 ? t.toFixed(t % 1 ? 1 : 0) : Math.round(t)}</text>`;
    }
    // month labels
    let lastM = "";
    data.dates.forEach((d, i) => {
      const m = d.slice(0, 7);
      if (m !== lastM && i > 2 && i < n - 3) {
        svg += `<line x1="${x(i).toFixed(1)}" x2="${x(i).toFixed(1)}" y1="${P.t}" y2="${H - axisH}" stroke="${C.grid}" stroke-width="1"/>`;
        svg += `<text x="${x(i).toFixed(1)}" y="${H - 7}" fill="${C.axis}" font-size="10.5" text-anchor="middle" font-family="IBM Plex Mono, monospace">${fmtDate(d, { month: "short" })}</text>`;
      }
      lastM = m;
    });
    // channel / band fill
    const bands = data.overlays.filter(o => o.style === "band");
    if (bands.length === 2) {
      const [a, b] = bands; let seg = [];
      const flush = () => {
        if (seg.length > 1) {
          const top = seg.map(i => `${x(i).toFixed(1)},${y(a.values[i]).toFixed(1)}`);
          const bot = seg.slice().reverse().map(i => `${x(i).toFixed(1)},${y(b.values[i]).toFixed(1)}`);
          svg += `<polygon points="${top.concat(bot).join(" ")}" fill="${C.band}" fill-opacity="0.07"/>`;
        }
        seg = [];
      };
      a.values.forEach((v, i) => (v != null && b.values[i] != null) ? seg.push(i) : flush()); flush();
    }
    // focus line
    if (opts.focus != null) {
      svg += `<line x1="${x(opts.focus).toFixed(1)}" x2="${x(opts.focus).toFixed(1)}" y1="${P.t}" y2="${H - axisH}" stroke="${C.accent}" stroke-opacity=".35" stroke-dasharray="3 3"/>`;
    }
    // candles
    const bw = Math.max(1, Math.min(9, cw * 0.62));
    for (let i = 0; i < n; i++) {
      const up = data.c[i] >= data.o[i], col = up ? C.up : C.down;
      svg += `<line x1="${x(i).toFixed(1)}" x2="${x(i).toFixed(1)}" y1="${y(data.h[i]).toFixed(1)}" y2="${y(data.l[i]).toFixed(1)}" stroke="${col}" stroke-width="1"/>`;
      const top = y(Math.max(data.o[i], data.c[i])), bh = Math.max(1, Math.abs(y(data.o[i]) - y(data.c[i])));
      svg += `<rect x="${(x(i) - bw / 2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" fill="${col}"/>`;
    }
    // overlays
    for (const o of data.overlays) {
      svg += `<path d="${linePath(o.values, x, y)}" fill="none" stroke="${STYLE[o.style] || C.muted}" stroke-width="${o.style === "band" ? 1 : 1.6}" stroke-opacity="${o.style === "band" ? .7 : 1}"/>`;
    }
    // pattern drawings
    for (const s of data.shapes) {
      const pts = s.points.map(p => `${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join(" ");
      svg += `<polyline points="${pts}" fill="none" stroke="${C.shape}" stroke-width="1.8" ${s.dash ? 'stroke-dasharray="5 4"' : ""} stroke-linejoin="round"/>`;
      if (!s.dash) s.points.forEach(p => svg += `<circle cx="${x(p[0]).toFixed(1)}" cy="${y(p[1]).toFixed(1)}" r="2.6" fill="${C.shape}"/>`);
    }
    // signal markers
    for (const m of data.markers) {
      const bull = m.side > 0, cx = x(m.i);
      const ty = bull ? y(data.l[m.i]) + 9 : y(data.h[m.i]) - 9;
      const tri = bull ? `${cx - 6},${ty + 9} ${cx + 6},${ty + 9} ${cx},${ty}` : `${cx - 6},${ty - 9} ${cx + 6},${ty - 9} ${cx},${ty}`;
      svg += `<polygon points="${tri}" fill="${bull ? C.up : C.down}" stroke="#000" stroke-width="1"/>`;
    }
    // indicator pane
    if (data.panel) {
      const p = data.panel, top = P.t + priceH + panelGap;
      let plo = p.min ?? Infinity, phi = p.max ?? -Infinity;
      if (p.min == null) { p.lines.forEach(l => l.values.forEach(v => { if (v != null) { plo = Math.min(plo, v); phi = Math.max(phi, v); } })); (p.hist || []).forEach(v => { if (v != null) { plo = Math.min(plo, v); phi = Math.max(phi, v); } }); const pp = (phi - plo) * .1; plo -= pp; phi += pp; }
      const py = v => top + (phi - v) / (phi - plo) * panelH;
      svg += `<line x1="${P.l}" x2="${W - P.r}" y1="${top - panelGap / 2}" y2="${top - panelGap / 2}" stroke="${C.grid}"/>`;
      (p.levels || []).forEach(lv => {
        svg += `<line x1="${P.l}" x2="${W - P.r}" y1="${py(lv).toFixed(1)}" y2="${py(lv).toFixed(1)}" stroke="${C.axis}" stroke-opacity=".5" stroke-dasharray="3 3"/>`;
        svg += `<text x="${W - P.r + 6}" y="${(py(lv) + 4).toFixed(1)}" fill="${C.axis}" font-size="10.5" font-family="IBM Plex Mono, monospace">${lv}</text>`;
      });
      if (p.hist) p.hist.forEach((v, i) => {
        if (v == null) return;
        const y0 = py(0), y1 = py(v);
        svg += `<rect x="${(x(i) - bw / 2).toFixed(1)}" y="${Math.min(y0, y1).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(.5, Math.abs(y1 - y0)).toFixed(1)}" fill="${v >= 0 ? C.up : C.down}" fill-opacity=".45"/>`;
      });
      p.lines.forEach(l => svg += `<path d="${linePath(l.values, x, py)}" fill="none" stroke="${STYLE[l.style] || C.muted}" stroke-width="1.5"/>`);
      svg += `<text x="${P.l + 4}" y="${top + 11}" fill="${C.axis}" font-size="10.5" font-family="IBM Plex Mono, monospace">${esc(p.name)}</text>`;
    }
    svg += `<line class="xhair" x1="0" x2="0" y1="${P.t}" y2="${H - axisH}" stroke="#fff" stroke-opacity=".35" visibility="hidden"/>`;
    svg += "</svg>";

    const legendItems = [...data.overlays.filter((o, i, a) => o.style !== "band" || a.findIndex(z => z.style === "band") === i)
      .map(o => [o.style === "band" ? (bands.length === 2 ? "Bands / channel" : o.name) : o.name, STYLE[o.style]]),
      ...(data.panel ? data.panel.lines.map(l => [l.name, STYLE[l.style] || C.muted]) : []),
      ...(data.shapes.length ? [["Pattern", C.shape]] : [])];
    box.innerHTML = `<div class="readout"></div>${svg}` +
      (legendItems.length ? `<div class="legend">${legendItems.map(([t, c]) => `<span><i style="background:${c}"></i>${esc(t)}</span>`).join("")}</div>` : "");

    const readout = box.querySelector(".readout"), el = box.querySelector("svg"), xh = box.querySelector(".xhair");
    const show = i => {
      const ch = data.c[i] - (i ? data.c[i - 1] : data.o[i]), pct = ch / (i ? data.c[i - 1] : data.o[i]) * 100;
      readout.innerHTML = `<b>${fmtDate(data.dates[i], { day: "numeric", month: "short", year: "2-digit" })}</b>  O ${money(data.o[i])}  H ${money(data.h[i])}  L ${money(data.l[i])}  C <b>${money(data.c[i])}</b> <span class="${ch >= 0 ? "up" : "down"}">${pct >= 0 ? "+" : ""}${pct.toFixed(1)}%</span>`;
    };
    const rest = opts.focus ?? n - 1;
    show(rest);
    const move = e => {
      const r = el.getBoundingClientRect(), px = (e.clientX - r.left) * (W / r.width);
      const i = Math.max(0, Math.min(n - 1, Math.floor((px - P.l) / cw)));
      xh.setAttribute("x1", x(i)); xh.setAttribute("x2", x(i)); xh.setAttribute("visibility", "visible"); show(i);
    };
    el.addEventListener("pointermove", move);
    el.addEventListener("pointerdown", move);
    el.addEventListener("pointerleave", () => { xh.setAttribute("visibility", "hidden"); show(rest); });
  }

  const charts = [];
  function mountChart(box, data, opts) { charts.push([box, data, opts]); drawChart(box, data, opts); }
  let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => charts.forEach(([b, d, o]) => b.isConnected && drawChart(b, d, o)), 150); });

  // ---------------------------------------------------------------- views
  function header(title, back, right = "") {
    return `<header class="top">${back ? `<a class="back" href="${back}" aria-label="Back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>Back</a>` : `<h1>${title}</h1>`}${right}</header>`;
  }
  const demoNote = () => S.feed?.demo ? `<div class="demo">Demo data: these alerts come from simulated prices on made-up tickers, so you can see how the app works. Real S&amp;P 100 alerts appear once the daily scan runs on GitHub.</div>` : "";

  function followedAlerts() {
    return (S.feed?.alerts || []).filter(a => S.follow.has(a.strategy));
  }

  function viewAlerts() {
    const followed = [...S.follow].filter(id => S.byId[id]);
    if (!followed.length) {
      return header("Alerts") + `<div class="empty"><strong>Pick your strategies</strong>Follow at least one strategy and its alerts show up here.<br><br><a class="btn" href="#strategies">Browse strategies</a></div>`;
    }
    if (!followed.includes(S.filter)) S.filter = "all";
    const list = followedAlerts().filter(a => S.filter === "all" || a.strategy === S.filter);
    const stamp = S.feed ? `<div class="stamp">${esc(S.feed.universe)}<br>close ${fmtDate(S.feed.as_of, { day: "numeric", month: "short" })}</div>` : "";
    let h = header("Alerts", null, stamp) + demoNote();
    h += `<div class="chips" role="group" aria-label="Filter by strategy">` +
      `<button class="chip" data-filter="all" aria-pressed="${S.filter === "all"}">All followed</button>` +
      followed.map(id => `<button class="chip" data-filter="${id}" aria-pressed="${S.filter === id}">${esc(S.byId[id].name)}</button>`).join("") + `</div>`;
    if (!list.length) return h + `<div class="empty"><strong>No alerts yet</strong>None of your strategies has fired in the last few weeks. Quiet periods are normal, especially for the slow strategies.</div>`;
    let day = "";
    for (const a of list) {
      if (a.date !== day) {
        day = a.date;
        const cnt = list.filter(z => z.date === day).length;
        h += `<div class="day"><span>${esc(dayLabel(day))}</span><span>${cnt} alert${cnt > 1 ? "s" : ""}</span></div>`;
      }
      const idx = S.feed.alerts.indexOf(a);
      h += `<a class="alert ${a.side}" href="#alert-${idx}" style="color:inherit;text-decoration:none">
        <span class="stripe"></span>
        <span class="main"><span class="tk">${esc(a.ticker)}<span class="strat">${esc(S.byId[a.strategy]?.name)}</span></span>
          <div class="note">${esc(a.note)}</div></span>
        <span class="px">${money(a.price)}<br><span class="pill">${a.side}</span></span></a>`;
    }
    return h;
  }

  function viewStrategies() {
    let h = header("Strategies") + `<p class="tag" style="margin-top:2px">Switch on the ones you want alerts for. Tap a strategy to learn how it works.</p>`;
    const cats = [...new Set(S.strategies.map(s => s.category))];
    const counts = {}; (S.feed?.alerts || []).forEach(a => counts[a.strategy] = (counts[a.strategy] || 0) + 1);
    for (const c of cats) {
      h += `<div class="cat">${esc(c)}</div>`;
      for (const s of S.strategies.filter(s => s.category === c)) {
        const on = S.follow.has(s.id);
        h += `<div class="srow"><a class="open" href="#strategy-${slug(s.id)}" style="color:inherit;text-decoration:none">
          <h3>${esc(s.name)}</h3><p>${esc(s.tagline)}</p>
          <div class="meta"><span>${esc(s.level)}</span><span>·</span><span><b>${counts[s.id] || 0}</b> recent alerts</span>${S.bt?.strategies?.[s.id]?.bullish?.["20"]?.hit != null ? `<span>·</span><span><b>${Math.round(S.bt.strategies[s.id].bullish["20"].hit)}%</b> right after 20d</span>` : ""}</div></a>
          <button class="toggle" role="switch" aria-checked="${on}" aria-label="Follow ${esc(s.name)}" data-follow="${s.id}"></button></div>`;
      }
    }
    return h;
  }

  function viewStrategy(id) {
    const s = S.byId[id];
    if (!s) return viewStrategies();
    const on = S.follow.has(id);
    const side = S.exSide[id] || "bullish";
    const ex = s.examples.find(e => e.side === side) || s.examples[0];
    const recent = (S.feed?.alerts || []).filter(a => a.strategy === id).slice(0, 5);
    let h = header("", "#strategies");
    h += `<h1 style="font:700 30px/1.1 var(--font-display);margin:4px 0 6px;text-wrap:balance">${esc(s.name)}</h1>`;
    h += `<p class="tag">${esc(s.tagline)}</p>`;
    h += `<div class="lede"><span class="badge">${esc(s.category)}</span><span class="badge">${esc(s.level)}</span><span class="badge">Daily chart</span>
      <span style="flex:1"></span><button class="btn ${on ? "on" : ""}" data-follow="${id}">${on ? "✓ Following" : "Follow"}</button></div>`;
    h += `<div class="prose">${s.how.map(p => `<p>${esc(p)}</p>`).join("")}</div>`;
    h += `<h2>When it alerts</h2><div class="rules">
      <div class="rule bullish"><span class="pill bullish">bullish</span><p>${esc(s.bullish)}</p></div>
      <div class="rule bearish"><span class="pill bearish">bearish</span><p>${esc(s.bearish)}</p></div></div>`;
    h += `<h2>Example</h2><div class="seg" role="group" aria-label="Example">${s.examples.map(e =>
      `<button data-ex="${e.side}" aria-pressed="${e.side === side}">${e.side === "bullish" ? "Bullish" : "Bearish"}</button>`).join("")}</div>`;
    h += `<div class="chartbox" id="exchart"></div>`;
    const mv = ex.after_move;
    h += `<p class="caption">The triangle marks the alert: <strong>${esc(ex.signal)}</strong>. Over the next ${ex.after_days} sessions the price went <span class="${mv >= 0 ? "up" : "down"}">${mv >= 0 ? "up" : "down"} ${Math.abs(mv)}%</span>.
      <span class="sim">Simulated prices, generated by the same detector that scans the real market. Picked because it shows the idea clearly; many real signals don't work out this well.</span></p>`;
    const bt = btSection(id);
    h += bt.html;
    h += `<h2>Why it can work</h2><div class="prose"><p>${esc(s.why)}</p></div>`;
    h += `<h2>Watch out for</h2><ul class="watch">${s.watch_out.map(w => `<li>${esc(w)}</li>`).join("")}</ul>`;
    h += `<h2>Settings used</h2><div class="settings">${esc(s.settings)}</div>`;
    if (recent.length) {
      h += `<h2>Latest alerts</h2>`;
      recent.forEach(a => {
        h += `<a class="alert ${a.side}" href="#alert-${S.feed.alerts.indexOf(a)}" style="color:inherit;text-decoration:none"><span class="stripe"></span>
          <span class="main"><span class="tk">${esc(a.ticker)}</span><div class="note">${esc(fmtDate(a.date, { day: "numeric", month: "short" }))} · ${esc(a.note)}</div></span>
          <span class="px">${money(a.price)}<br><span class="pill">${a.side}</span></span></a>`;
      });
    }
    h += `<p class="fine">For information and learning only. This is not investment advice.</p>`;
    return { html: h, after: () => { mountChart(document.getElementById("exchart"), ex.chart, { focus: ex.chart.focus, label: `${s.name} ${side} example chart` }); bt.after?.(); } };
  }

  // ------------------------------------------------------------- backtest
  const eur = v => "€" + Math.round(v).toLocaleString("en-US");
  const pc = v => v == null ? "–" : Math.round(v) + "%";
  const sgn = v => v == null ? "–" : (v > 0 ? "+" : "") + v.toFixed(1) + "%";

  function btSection(id) {
    const B = S.bt, r = B?.strategies?.[id];
    let h = `<h2 id="bt">How it did in the past</h2>`;
    if (!r) return { html: h + `<div class="card" style="margin-top:0"><p style="margin:0">Results appear here after the weekly backtest runs on GitHub (or run it once by hand from the Actions tab).</p></div>` };
    const side = S.btSide[id] || "bullish", st = r[side];
    if (B.demo) h += `<div class="demo">Demo backtest on simulated prices. Real results replace these once the backtest runs on GitHub.</div>`;
    h += `<div class="seg" role="group" aria-label="Alert type">${["bullish", "bearish"].map(sd =>
      `<button data-bt="${sd}" aria-pressed="${sd === side}">${sd === "bullish" ? "Bullish" : "Bearish"} alerts</button>`).join("")}</div>`;
    h += `<p class="sub" style="margin-bottom:10px"><strong style="color:var(--fg)">${st.n.toLocaleString("en-US")}</strong> ${side} alerts on ${B.tickers} stocks, ${B.start.slice(0, 4)}–${B.end.slice(0, 4)}. ` +
      `“Right way” means the price ${side === "bullish" ? "rose" : "fell"} afterwards. Each result is compared with a random day in the same stocks.</p>`;
    if (!st.n) return { html: h + `<p class="tag">No ${side} alerts in this period.</p>` };
    h += `<div class="tablewrap"><table class="bt"><thead><tr><th>After</th><th>Right way</th><th>Average move</th></tr></thead><tbody>`;
    for (const k of ["5", "20", "60"]) {
      const c = st[k];
      const hitCls = c.hit > c.base_hit ? "up" : "down", avgCls = c.avg > c.base_avg ? "up" : "down";
      h += `<tr><td>${k} days</td>
        <td><b class="${hitCls}">${pc(c.hit)}</b><small>random day ${pc(c.base_hit)}</small></td>
        <td><b class="${avgCls}">${sgn(c.avg)}</b><small>random day ${sgn(c.base_avg)}</small></td></tr>`;
    }
    h += `</tbody></table></div><p class="hint">Green means better than a random day, red means worse. Moves are shown in the alert's direction: for bearish alerts, a fall counts as positive.</p>`;
    h += `<h3 class="h3">Spread of 20-day results</h3><div class="chartbox" id="bthist"></div>`;

    const e = r.equity;
    h += `<h3 class="h3">${eur(B.capital)} following the bullish alerts</h3>
      <p class="hint" style="margin-top:0">${esc(r.rule)}. Money is split equally across open positions; idle cash earns nothing.</p>
      <div class="chartbox" id="bteq"></div>
      <div class="tiles">
        <div><span>Final value</span><b class="${e.final >= e.bench_final ? "up" : "down"}">${eur(e.final)}</b><small>Buy &amp; hold ${eur(e.bench_final)}</small></div>
        <div><span>Per year</span><b class="${e.cagr >= e.bench_cagr ? "up" : "down"}">${sgn(e.cagr)}</b><small>Buy &amp; hold ${sgn(e.bench_cagr)}</small></div>
        <div><span>Worst drop</span><b class="${e.maxdd >= e.bench_maxdd ? "up" : "down"}">${sgn(e.maxdd)}</b><small>Buy &amp; hold ${sgn(e.bench_maxdd)}</small></div>
        <div><span>Time invested</span><b>${pc(e.invested)}</b><small>avg ${e.avg_positions} stocks held</small></div>
      </div>`;
    const lst = (arr, title) => arr.length ? `<div class="bw"><h3 class="h3">${title}</h3>${arr.map(x =>
      `<div class="bwrow"><span class="tk" style="font-size:14px">${esc(x.ticker)}</span><span class="pill ${x.side}" style="margin:0">${x.side}</span><span class="d">${esc(fmtDate(x.date, { day: "numeric", month: "short", year: "numeric" }))}</span><span class="${(x.side === "bullish") === (x.ret >= 0) ? "up" : "down"}">${sgn(x.ret)}</span></div>`).join("")}</div>` : "";
    h += `<div class="bwgrid">${lst(r.best, "Best alerts (20 days later)")}${lst(r.worst, "Worst alerts (20 days later)")}</div>`;
    h += `<div class="card"><h3>Read this before trusting the numbers</h3><ul class="watch" style="color:var(--muted);font-size:14px">
      <li>No trading costs, taxes or slippage. Strategies that trade often look better here than in real life.</li>
      <li>It uses ${B.demo ? "the demo list" : "today's S&amp;P 100"}. Companies that collapsed and left the index are missing, which flatters every result, buy &amp; hold included.</li>
      <li>Past results don't predict future ones. A rule that worked for 15 years can stop working.</li></ul></div>`;
    return { html: h, after: () => {
      drawHist(document.getElementById("bthist"), st.hist);
      drawEquity(document.getElementById("bteq"), e);
    } };
  }

  function drawHist(box, hist) {
    const W = Math.max(280, box.clientWidth || 340), H = 150, P = { l: 10, r: 10, t: 14, b: 24 };
    const n = hist.counts.length, max = Math.max(1, ...hist.counts), bw = (W - P.l - P.r) / n;
    const total = hist.counts.reduce((a, b) => a + b, 0);
    let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Histogram of 20-day results"><rect width="${W}" height="${H}" fill="#000"/>`;
    hist.counts.forEach((c, i) => {
      const mid = (hist.edges[i] + hist.edges[i + 1]) / 2, bh = c / max * (H - P.t - P.b);
      svg += `<rect x="${(P.l + i * bw + 1.5).toFixed(1)}" y="${(H - P.b - bh).toFixed(1)}" width="${Math.max(1, bw - 3).toFixed(1)}" height="${bh.toFixed(1)}" rx="2" fill="${mid >= 0 ? C.up : C.down}" fill-opacity="${mid >= 0 ? .85 : .8}"/>`;
      if (c / total >= .04) svg += `<text x="${(P.l + (i + .5) * bw).toFixed(1)}" y="${(H - P.b - bh - 4).toFixed(1)}" fill="${C.axis}" font-size="9.5" text-anchor="middle" font-family="IBM Plex Mono, monospace">${Math.round(c / total * 100)}%</text>`;
    });
    const zx = P.l + hist.edges.indexOf(0) * bw;
    svg += `<line x1="${zx}" x2="${zx}" y1="${P.t - 6}" y2="${H - P.b}" stroke="#fff" stroke-opacity=".5" stroke-dasharray="2 3"/>`;
    [-20, -10, 0, 10, 20].forEach(v => {
      const i = hist.edges.indexOf(v); if (i < 0) return;
      svg += `<text x="${(P.l + i * bw).toFixed(1)}" y="${H - 8}" fill="${C.axis}" font-size="10.5" text-anchor="${i === 0 ? "start" : i === n ? "end" : "middle"}" font-family="IBM Plex Mono, monospace">${v > 0 ? "+" : v < 0 ? "−" : ""}${Math.abs(v)}%</text>`;
    });
    box.innerHTML = svg + `</svg><div class="legend" style="padding-top:8px"><span><i style="background:${C.up}"></i>moved the right way</span><span><i style="background:${C.down}"></i>moved the wrong way</span></div>`;
  }

  function drawEquity(box, e) {
    const W = Math.max(280, box.clientWidth || 340), H = 210, P = { l: 6, r: 58, t: 12, b: 22 };
    const n = e.dates.length, all = e.strategy.concat(e.benchmark).filter(v => v > 0);
    const lo = Math.log(Math.min(...all) * .92), hi = Math.log(Math.max(...all) * 1.08);
    const x = i => P.l + i / (n - 1) * (W - P.l - P.r), y = v => P.t + (hi - Math.log(Math.max(v, 1))) / (hi - lo) * (H - P.t - P.b);
    let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Growth of the strategy versus buy and hold"><rect width="${W}" height="${H}" fill="#000"/>`;
    // log-spaced gridlines at 1-2-5 steps
    const grid = []; for (let p = Math.floor(Math.log10(Math.exp(lo))); p <= Math.ceil(Math.log10(Math.exp(hi))); p++) [1, 2, 5].forEach(m => { const v = m * 10 ** p; if (Math.log(v) > lo && Math.log(v) < hi) grid.push(v); });
    const shown = grid.length > 5 ? grid.filter(v => String(v)[0] === "1" || String(v)[0] === "5") : grid;
    shown.forEach(v => {
      svg += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="${C.grid}"/>`;
      svg += `<text x="${W - P.r + 6}" y="${(y(v) + 4).toFixed(1)}" fill="${C.axis}" font-size="10.5" font-family="IBM Plex Mono, monospace">${v >= 1e6 ? "€" + v / 1e6 + "M" : v >= 1000 ? "€" + v / 1000 + "k" : "€" + v}</text>`;
    });
    let lastY = "";
    e.dates.forEach((d, i) => {
      const yr = d.slice(0, 4);
      if (yr !== lastY && i > 0) {
        const step = Math.ceil((+e.dates[n - 1].slice(0, 4) - +e.dates[0].slice(0, 4)) / 5) || 1;
        if ((+yr) % step === 0) svg += `<line x1="${x(i).toFixed(1)}" x2="${x(i).toFixed(1)}" y1="${P.t}" y2="${H - P.b}" stroke="${C.grid}"/><text x="${x(i).toFixed(1)}" y="${H - 7}" fill="${C.axis}" font-size="10.5" text-anchor="middle" font-family="IBM Plex Mono, monospace">${yr}</text>`;
      }
      lastY = yr;
    });
    const path = arr => arr.map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1)).join("");
    svg += `<path d="${path(e.benchmark)}" fill="none" stroke="${C.muted}" stroke-width="1.4"/>`;
    svg += `<path d="${path(e.strategy)}" fill="none" stroke="${C.accent}" stroke-width="1.8"/>`;
    svg += `<circle cx="${x(n - 1)}" cy="${y(e.strategy[n - 1])}" r="3" fill="${C.accent}"/><circle cx="${x(n - 1)}" cy="${y(e.benchmark[n - 1])}" r="3" fill="${C.muted}"/>`;
    svg += `<line class="xhair" x1="0" x2="0" y1="${P.t}" y2="${H - P.b}" stroke="#fff" stroke-opacity=".35" visibility="hidden"/></svg>`;
    box.innerHTML = `<div class="readout"></div>${svg}<div class="legend"><span><i style="background:${C.accent}"></i>Strategy</span><span><i style="background:${C.muted}"></i>Buy &amp; hold all stocks</span><span>log scale</span></div>`;
    const ro = box.querySelector(".readout"), el = box.querySelector("svg"), xh = box.querySelector(".xhair");
    const show = i => ro.innerHTML = `<b>${fmtDate(e.dates[i], { month: "short", year: "numeric" })}</b>  Strategy <b style="color:${C.accent}">${eur(e.strategy[i])}</b>  Buy &amp; hold <b>${eur(e.benchmark[i])}</b>`;
    show(n - 1);
    const mv = ev => { const r = el.getBoundingClientRect(), px = (ev.clientX - r.left) * (W / r.width); const i = Math.max(0, Math.min(n - 1, Math.round((px - P.l) / (W - P.l - P.r) * (n - 1)))); xh.setAttribute("x1", x(i)); xh.setAttribute("x2", x(i)); xh.setAttribute("visibility", "visible"); show(i); };
    el.addEventListener("pointermove", mv); el.addEventListener("pointerdown", mv);
    el.addEventListener("pointerleave", () => { xh.setAttribute("visibility", "hidden"); show(n - 1); });
  }

  function viewAlert(idx) {
    const a = S.feed?.alerts?.[idx];
    if (!a) return viewAlerts();
    const s = S.byId[a.strategy];
    let h = header("", "#alerts");
    h += `<div class="big"><span class="tk">${esc(a.ticker)}</span><span class="px">${money(a.price)}</span><span class="pill ${a.side}" style="margin:0">${a.side}</span></div>`;
    h += `<p class="sub">${esc(s?.name)} · close of ${esc(fmtDate(a.date, { weekday: "short", day: "numeric", month: "long" }))}</p>`;
    h += `<div class="chartbox" id="achart"><p class="loading">Loading chart…</p></div>`;
    h += `<p class="caption"><strong>${esc(a.note)}</strong></p>`;
    if (s) h += `<div class="card"><h3>What this means</h3><p>${esc(a.side === "bullish" ? s.bullish : s.bearish)}</p>
      <p>${esc(s.watch_out[0])}</p><a class="btn ghost" href="#strategy-${slug(s.id)}">How ${esc(s.name)} works</a></div>`;
    h += `<p class="fine">For information only. An alert describes what the chart did; it is not a recommendation to buy or sell.</p>`;
    return { html: h, after: async () => {
      const box = document.getElementById("achart");
      try {
        const data = a.chart || await (await fetch("data/charts/" + a.file)).json();
        const focus = data.markers[0]?.i;
        mountChart(box, data, { focus, label: `${a.ticker} chart with ${s?.name} alert` });
      } catch { box.innerHTML = `<p class="loading">The chart couldn't load. Check your connection and open the alert again.</p>`; }
    } };
  }

  function viewNotify() {
    const pre = S.feed?.ntfy_prefix;
    const followed = [...S.follow].filter(id => S.byId[id]);
    let h = header("Phone alerts");
    h += `<div class="prose"><p>Alerts always appear in this app. To also get a notification on your iPhone the moment the daily scan finds one, use the free <strong>ntfy</strong> app. Each strategy has its own channel, so you only get pinged for the ones you follow.</p></div>`;
    h += `<h2>Set it up</h2><ol class="steps">
      <li>Add this page to your Home Screen: in Safari tap Share, then <em>Add to Home Screen</em>.</li>
      <li>Install <strong>ntfy</strong> from the App Store and allow notifications.</li>
      <li>In ntfy tap <em>+</em> and subscribe to each channel below (server: ntfy.sh).</li></ol>`;
    h += `<h2>Your channels</h2>`;
    if (!pre) {
      h += `<div class="card" style="margin-top:0"><h3>Not switched on yet</h3><p>Phone notifications start once you add a secret name for your channels in the GitHub project (the <code>NTFY_PREFIX</code> variable, explained in the README). The channel names then show up here.</p></div>`;
    } else if (!followed.length) {
      h += `<p class="tag">Follow a strategy first, then its channel appears here.</p>`;
    } else {
      followed.forEach(id => {
        const t = `${pre}-${id}`;
        h += `<div class="topic"><span style="min-width:0"><span style="display:block;font-size:13px;color:var(--muted)">${esc(S.byId[id].name)}</span><code>${esc(t)}</code></span><button data-copy="${esc(t)}">Copy</button></div>`;
      });
    }
    h += `<p class="fine">The scan runs once a day after the US market closes (around 23:15 Milan time). Signal Desk shows information about price patterns. It doesn't trade and isn't investment advice.</p>`;
    return h;
  }

  // --------------------------------------------------------------- router
  function route() {
    const r = (location.hash || "#alerts").slice(1);
    let tab = "alerts", out;
    if (r === "strategies") { tab = "strategies"; out = viewStrategies(); }
    else if (r.startsWith("strategy-")) { tab = "strategies"; out = viewStrategy(unslug(r.slice(9))); }
    else if (r.startsWith("alert-")) { tab = "alerts"; out = viewAlert(+r.slice(6)); }
    else if (r === "notify") { tab = "notify"; out = viewNotify(); }
    else out = viewAlerts();
    const v = typeof out === "string" ? { html: out } : out;
    charts.length = 0;
    app.innerHTML = v.html;
    v.after?.();
    document.querySelectorAll(".tabs a").forEach(a => a.setAttribute("aria-current", a.dataset.tab === tab ? "page" : "false"));
    if (tab === "alerts" && !r.startsWith("alert-")) markSeen();
    updateBadge();
  }

  function markSeen() { const ids = followedAlerts().map(a => a.id); save(SEEN, ids); }
  function updateBadge() {
    const seen = new Set(load(SEEN, []));
    const n = followedAlerts().filter(a => !seen.has(a.id)).length;
    const b = document.getElementById("badge");
    b.hidden = !n || !seen.size; b.textContent = n > 99 ? "99+" : n;
  }

  app.addEventListener("click", e => {
    const f = e.target.closest("[data-follow]");
    if (f) {
      const id = f.dataset.follow;
      S.follow.has(id) ? S.follow.delete(id) : S.follow.add(id);
      save(STORE, [...S.follow]);
      const y = scrollY; route(); scrollTo(0, y); return;
    }
    const fl = e.target.closest("[data-filter]");
    if (fl) { S.filter = fl.dataset.filter; route(); return; }
    const ex = e.target.closest("[data-ex]");
    if (ex) { const id = unslug(location.hash.slice(10)); S.exSide[id] = ex.dataset.ex; const y = scrollY; route(); scrollTo(0, y); return; }
    const bs = e.target.closest("[data-bt]");
    if (bs) { const id = unslug(location.hash.slice(10)); S.btSide[id] = bs.dataset.bt; const y = scrollY; route(); scrollTo(0, y); return; }
    const cp = e.target.closest("[data-copy]");
    if (cp) {
      const txt = cp.dataset.copy;
      const done = () => { cp.textContent = "Copied"; setTimeout(() => cp.textContent = "Copy", 1500); };
      navigator.clipboard?.writeText(txt).then(done, () => { const r = document.createRange(); r.selectNodeContents(cp.previousElementSibling.querySelector("code")); getSelection().removeAllRanges(); getSelection().addRange(r); });
    }
  });
  addEventListener("hashchange", () => { route(); scrollTo(0, 0); });

  // ----------------------------------------------------------------- boot
  async function boot() {
    S.follow = new Set(load(STORE, DEFAULT_FOLLOW));
    try {
      const opt = url => fetch(url, { cache: "no-cache" }).then(r => r.ok ? r.json() : null).catch(() => null);
      const [st, fd, bt] = await Promise.all([
        fetch("data/strategies.json", { cache: "no-cache" }).then(r => r.json()),
        opt("data/alerts.json"), opt("data/backtest.json"),
      ]);
      S.strategies = st.strategies; S.feed = fd; S.bt = bt;
      S.strategies.forEach(s => S.byId[s.id] = s);
      route();
    } catch {
      app.innerHTML = `<div class="empty"><strong>Couldn't load the strategies</strong>Check your connection and reload the page.</div>`;
    }
  }
  boot();
})();
</script>
</body>
</html>
