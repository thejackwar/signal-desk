  // ------------------------------------------------------ chart backdrop
  // Faint, static market charts behind the stock pages: grid, a few long price lines with
  // a fading fill, a moving average and a band of candles. Seeded, so it never jumps around.
  function drawBackdrop() {
    const cv = document.getElementById("bgfx"); if (!cv) return;
    const crypto = S.market === "crypto";
    const dpr = Math.min(2, devicePixelRatio || 1), W = innerWidth, H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
    let seed = crypto ? 7350 : 20261027;
    const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    const walk = (n, vol, drift) => { const a = [0]; for (let i = 1; i < n; i++) a.push(a[i - 1] + (rnd() - .5) * vol + drift + Math.sin(i / 23) * vol * .18); return a; };
    const gs = W > 1000 ? 64 : 48;

    // grid: plain lines for stocks, a dotted field for crypto
    if (crypto) {
      g.fillStyle = "rgba(181,123,255,0.11)";
      for (let x = gs / 2; x < W; x += gs / 2) for (let y = gs / 2; y < H; y += gs / 2) { g.beginPath(); g.arc(x, y, .9, 0, 7); g.fill(); }
    } else {
      g.strokeStyle = "rgba(255,255,255,0.03)"; g.lineWidth = 1;
      for (let x = (W % gs) / 2; x < W; x += gs) { g.beginPath(); g.moveTo(x + .5, 0); g.lineTo(x + .5, H); g.stroke(); }
      for (let y = (H % gs) / 2; y < H; y += gs) { g.beginPath(); g.moveTo(0, y + .5); g.lineTo(W, y + .5); g.stroke(); }
    }

    // long price lines (crypto lines glow)
    const lines = crypto ? [
      { top: .3, amp: .22, color: "77,232,255", a: .22, fill: .06, drift: .5, vol: 9, glow: 14 },
      { top: .48, amp: .18, color: "181,123,255", a: .2, fill: .05, drift: .25, vol: 8, glow: 12 },
      { top: .4, amp: .12, color: "255,79,154", a: .12, fill: 0, drift: -.15, vol: 7, glow: 8 },
    ] : [
      { top: .14, amp: .20, color: "50,196,141", a: .18, fill: .065, drift: .35, vol: 6 },
      { top: .44, amp: .16, color: "242,179,61", a: .12, fill: .035, drift: .2, vol: 5 },
      { top: .28, amp: .12, color: "116,167,245", a: .1, fill: 0, drift: -.1, vol: 4 },
    ];
    const N = Math.ceil(W / 4) + 2;
    const BD = S.stocks?.backdrop?.lines?.length ? S.stocks.backdrop : null;
    // real prices: resample each series to the screen width. Stocks lines share one scale
    // (index + its averages); crypto coins each get their own band.
    const resample = vals => { const a = vals.filter(v => v != null); return Array.from({ length: N }, (_, i) => a[Math.min(a.length - 1, Math.round(i / (N - 1) * (a.length - 1)))]); };
    const realSets = BD ? BD.lines.map(l => resample(l.values)) : null;
    if (BD && !crypto) { const flat = realSets.flat(); var shLo = Math.min(...flat), shHi = Math.max(...flat); }
    if (BD && !crypto) lines.forEach(L => { L.top = .42; L.amp = .22; });
    for (const [li, L] of lines.entries()) {
      if (realSets && !realSets[li]) continue;
      const v = realSets ? realSets[li] : walk(N, L.vol, L.drift);
      const lo = realSets && !crypto ? shLo : Math.min(...v), hi = realSets && !crypto ? shHi : Math.max(...v);
      const y = i => H * (L.top + L.amp) - (v[i] - lo) / ((hi - lo) || 1) * H * L.amp * 2;
      g.beginPath(); for (let i = 0; i < N; i++) i ? g.lineTo(i * 4, y(i)) : g.moveTo(0, y(0));
      g.save();
      if (L.glow) { g.shadowColor = `rgba(${L.color},.8)`; g.shadowBlur = L.glow; }
      g.strokeStyle = `rgba(${L.color},${L.a})`; g.lineWidth = crypto ? 1.8 : 1.6; g.stroke();
      g.restore();
      if (L.fill && !(realSets && !crypto && li > 0)) {
        g.lineTo((N - 1) * 4, H); g.lineTo(0, H); g.closePath();
        const gr = g.createLinearGradient(0, H * L.top, 0, H * (L.top + L.amp * 2.4));
        gr.addColorStop(0, `rgba(${L.color},${L.fill})`); gr.addColorStop(1, `rgba(${L.color},0)`); g.fillStyle = gr; g.fill();
      }
    }

    // crypto only: a little chain of linked blocks drifting across the upper right
    if (crypto) {
      const n = W > 1000 ? 7 : 4, bs = W > 1000 ? 22 : 18;
      const pts = [];
      for (let i = 0; i < n; i++) pts.push([W * (.52 + i * (.44 / n)) + (rnd() - .5) * 20, H * (.1 + Math.sin(i * .9) * .05 + i * .012)]);
      g.save(); g.setLineDash([3, 5]); g.strokeStyle = "rgba(77,232,255,0.16)"; g.lineWidth = 1.2;
      g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke(); g.restore();
      pts.forEach(([x, y], i) => {
        g.save(); g.shadowColor = "rgba(181,123,255,.7)"; g.shadowBlur = 10;
        g.strokeStyle = i % 2 ? "rgba(181,123,255,0.24)" : "rgba(77,232,255,0.22)"; g.lineWidth = 1.4;
        g.beginPath(); g.roundRect ? g.roundRect(x - bs / 2, y - bs / 2, bs, bs, 5) : g.rect(x - bs / 2, y - bs / 2, bs, bs); g.stroke();
        g.restore();
        g.fillStyle = "rgba(181,123,255,0.18)"; g.fillRect(x - 3, y - 3, 6, 6);
      });
    }

    // candles along the bottom with a moving average
    const RC = BD?.candles;
    let cw = W > 1000 ? 11 : 9, n = Math.ceil(W / cw) + 1;
    const base = H * .84, span = H * .14;
    let c, oo, hh, ll;
    if (RC) {
      const k = Math.min(RC.close.length, n);
      cw = W / k; n = k;
      const sl = a => a.slice(-k);
      oo = sl(RC.open); hh = sl(RC.high); ll = sl(RC.low);
      c = Array(20).fill(null).concat(sl(RC.close));
      for (let i = 0; i < 20; i++) c[i] = RC.close[Math.max(0, RC.close.length - k - 20 + i)];
    } else c = walk(n + 20, crypto ? 4.5 : 3.2, .06);
    const allv = RC ? hh.concat(ll) : c, lo = Math.min(...allv), hi = Math.max(...allv), py = v => base - (v - lo) / ((hi - lo) || 1) * span;
    const upC = crypto ? "rgba(44,245,154,0.17)" : "rgba(50,196,141,0.15)", dnC = crypto ? "rgba(255,79,154,0.17)" : "rgba(240,90,99,0.135)";
    for (let i = 0; i < n; i++) {
      const o = RC ? oo[i] : c[i + 19], cl = c[i + 20], up = cl >= o, x = i * cw + cw / 2;
      const h1 = RC ? hh[i] : Math.max(o, cl) + rnd() * 1.6, l1 = RC ? ll[i] : Math.min(o, cl) - rnd() * 1.6;
      g.strokeStyle = g.fillStyle = up ? upC : dnC;
      g.lineWidth = 1; g.beginPath(); g.moveTo(x + .5, py(h1)); g.lineTo(x + .5, py(l1)); g.stroke();
      g.fillRect(x - cw * .3, py(Math.max(o, cl)), cw * .6, Math.max(1, Math.abs(py(o) - py(cl))));
    }
    g.beginPath();
    for (let i = 0; i < n; i++) { let m = 0; for (let k = 0; k < 10; k++) m += c[i + 20 - k]; m /= 10; const x = i * cw + cw / 2; i ? g.lineTo(x, py(m)) : g.moveTo(x, py(m)); }
    g.save(); if (crypto) { g.shadowColor = "rgba(181,123,255,.8)"; g.shadowBlur = 8; }
    g.strokeStyle = crypto ? "rgba(181,123,255,0.22)" : "rgba(242,179,61,0.16)"; g.lineWidth = 1.5; g.stroke(); g.restore();

    // darken the middle so text stays easy to read
    const vg = g.createRadialGradient(W / 2, H * .45, Math.min(W, H) * .15, W / 2, H * .45, Math.max(W, H) * .75);
    vg.addColorStop(0, crypto ? "rgba(11,7,20,0.5)" : "rgba(8,9,11,0.45)"); vg.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = vg; g.fillRect(0, 0, W, H);
  }
  let bgT; addEventListener("resize", () => { clearTimeout(bgT); bgT = setTimeout(drawBackdrop, 200); });

  // --------------------------------------------------------------- market
  const CACHE = {};
  const opt = url => fetch(url, { cache: "no-cache" }).then(r => r.ok ? r.json() : null).catch(() => null);
  async function loadMarket(m) {
    if (!CACHE[m]) {
      const b = MK[m].base;
      const [feed, bt, stocks, liq, news] = await Promise.all([opt(b + "alerts.json"), opt(b + "backtest.json"), opt(b + "stocks.json"), m === "crypto" ? opt(b + "liquidations.json") : null, opt(b + "news.json")]);
      CACHE[m] = { feed, bt, stocks, liq, news, stockData: {} };
    }
    const c = CACHE[m];
    S.market = m; S.liq = c.liq; S.news = c.news; S.newsSrc = "all"; S.feed = c.feed; S.bt = c.bt; S.stocks = c.stocks; S.stockData = c.stockData;
    S.stockBy = {}; (c.stocks?.stocks || []).forEach(r => S.stockBy[r.ticker] = r);
    S.q = ""; S.filter = "all";
    document.documentElement.dataset.market = m;
    document.querySelector('meta[name="theme-color"]').content = m === "crypto" ? "#0b0714" : "#08090b";
    applyPalette();
    drawBackdrop();
    document.querySelectorAll('[data-l="tab"]').forEach(el => el.textContent = MK[m].Tab);
    document.querySelectorAll(".side-sw").forEach(el => el.innerHTML = switchHtml());
    const fd = c.feed;
    document.getElementById("sidefoot").innerHTML = (fd ? `<b>${esc(fd.universe)}</b> · ${fd.tickers} ${MK[m].noun}<br>Close of ${fmtDate(fd.as_of, { day: "numeric", month: "short", year: "numeric" })}` : "");
  }
  const switchHtml = () => [["stocks", "📈", "Stocks"], ["crypto", "🪙", "Crypto"]].map(([m, ic, t]) =>
    `<button data-market="${m}" aria-pressed="${S.market === m}"><span aria-hidden="true">${ic}</span>${t}</button>`).join("");
  async function switchMarket(m) {
    if (m === S.market) return;
    setPref("market", m);
    await loadMarket(m);
    S.lastSel = null; S.lastTab = null;
    const tab = (location.hash || "#alerts").slice(1);
    const base = tab.startsWith("strateg") ? (tab.startsWith("strategy-") ? tab : "strategies") : tab.startsWith("stock") || tab === "heatmap" ? "stocks" : tab === "news" ? "news" : tab === "notify" ? "notify" : "alerts";
    if ("#" + base !== location.hash) location.hash = base; else route();
    scrollTo(0, 0);
  }
  document.addEventListener("click", e => {
    const b = e.target.closest("button[data-market]");
    if (b) { e.preventDefault(); switchMarket(b.dataset.market); }
  });

  // ----------------------------------------------------------------- boot
  async function boot() {
    S.follow = new Set(load(STORE, DEFAULT_FOLLOW));
    S.prefs = load(PREFS, {}) || {};
    try {
      const st = await fetch("data/strategies.json", { cache: "no-cache" }).then(r => r.json());
      S.strategies = st.strategies;
      S.strategies.forEach(s => S.byId[s.id] = s);
      await loadMarket(pref("market", "stocks") === "crypto" ? "crypto" : "stocks");
      route();
    } catch (err) {
      console.error(err);
      app.innerHTML = `<div class="empty"><strong>Couldn't load the data</strong>Check your connection and reload the page.</div>`;
    }
  }
  boot();
})();
</script>
</body>
